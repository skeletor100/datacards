<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Core Stratagem Renderer</title>
  <link rel="stylesheet" href="./waha_common.css?v=1" />
  <style>
    :root{
      --card-w:1800px; --card-h:1200px; --strat-card-w:1200px; --strat-card-h:1800px; --paper:#ece9df; --ink:#111; --banner:#084563;
      --frame:#4b6262; --green:#22796c; --blue:#096691; --red:#bf0d12;
      --font:"Conduit ITC","ConduitITC","Bahnschrift Condensed","Aptos Narrow","Arial Narrow",Arial,sans-serif;
    }
    *{box-sizing:border-box} body{margin:0;background:#242424;color:var(--ink);font-family:var(--font);padding:24px}
    .toolbar{max-width:var(--strat-card-w);margin:0 auto 16px;color:#ddd;font:14px Arial,sans-serif;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar select{padding:6px 8px}.toolbar label{display:flex;gap:6px;align-items:center}
    #app{width:min(96vw,var(--strat-card-w));margin:0 auto;display:grid;gap:24px}.hidden{display:none!important}
    .core-stratagem-card {
        width: 1200px;
        height: 1800px;
        background: var(--paper);
        border: 4px solid var(--frame);
        position: relative;
        overflow: hidden;
        container-type: inline-size;
        box-shadow: 0 12px 40px rgba(0,0,0,.45);
    }
    .core-stratagem-card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 18% 22%,rgba(255,255,255,.35),transparent 28%),linear-gradient(90deg,rgba(0,0,0,.035),transparent 20%,transparent 80%,rgba(0,0,0,.07));pointer-events:none}
    .header{position:absolute;left:4%;right:4%;top:3%;height:10.2%;background:var(--banner);color:#fff;padding:0 1.55%;text-transform:uppercase;font-weight:900;letter-spacing:.035em;line-height:.95}.header::after{content:"";position:absolute;left:1.55%;right:1.55%;top:50%;height:.42cqw;background:#fff;transform:translateY(-50%)}.kicker{position:absolute;left:1.55%;right:1.55%;top:12%;font-size:2.26cqw;line-height:1}.page-title{position:absolute;left:1.55%;right:1.55%;line-height:.9}
    .rule-card,
    .core-stratagem-card {
        margin: 0 auto;
    }
    .rule-card .header{
      height:8.2%;
    }
    .rule-card .kicker{
      font-size:4.2cqw;
    }
    .rule-card .page-title{
      font-size:3.9cqw;
      bottom:11%;
    }
    .core-stratagem-card .page-title{font-size:3.4cqw; bottom:11%;}
    .content{position:absolute;left:4%;right:4%;top:16%;bottom:4%;overflow:hidden}
    .section-title{background:var(--frame);color:white;text-transform:uppercase;font-weight:900;letter-spacing:.04em;font-size:3.0cqw;padding:.35cqw 1cqw;margin-bottom:.75cqw}
    .rule-body{font:var(--rule-fs,2.4cqw)/1.20 var(--font)}
    .rule-name,
    .enh-name{font-weight:900;text-transform:uppercase;font-size:calc(var(--enh-fs,2.15cqw) * 1.5);letter-spacing:.02em;margin:.35cqw 0 .14cqw}
    .subrule-title{font-weight:900;text-transform:uppercase;font-size:calc(var(--rule-fs,2.4cqw) * 1.15);margin:.55cqw 0 .08cqw}.enh-grid{display:grid;grid-template-columns:1fr 1fr;gap:.85cqw 2.0cqw}.enh-card{border-top:.18cqw dotted #222;padding-top:.32cqw;min-width:0}
    .enh-text{font:var(--enh-fs,2.15cqw)/1.16 var(--font)}
    .rule-table,
    .content-table{
      width:100%;
      border-collapse:collapse;
      margin:.35cqw 0;
      font:inherit;
    }

    .rule-table td,
    .content-table td{
      padding:.08cqw .6cqw .08cqw 0;
      font-weight:900;
      text-transform:uppercase;
    }
     p{margin:.30cqw 0}
    .rule-card .content{
      top:12.2%;
      bottom:3.2%;
      display:grid;
      grid-template-rows:var(--rules-row, auto) minmax(0, 1fr);
      gap:1.1cqw;
    }
    .rules-zone,
    .enh-zone{
      min-height:0;
      overflow:hidden;
      position:relative;
    }
    .rules-fit,
    .enh-fit{
      transform-origin:top left;
      width:100%;
    }
    .enh-zone{
      display:grid;
      grid-template-rows:auto minmax(0,1fr);
    }
    .core-stratagem-card .header{height:8.2%;}.core-stratagem-card .kicker{font-size:3.7cqw}.core-stratagem-card .page-title{font-size:3.2cqw}.core-stratagem-card .content{top:12.2%;bottom:3.2%}
    .core-stratagem-grid{
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 2.3cqw;
      align-items: start;
      height: 100%;
      overflow: hidden;
    }
    .core-stratagem-col{
      display: flex;
      flex-direction: column;
      gap: 1.5cqw;
      min-width: 0;
    }
    .core-stratagem-card { margin: 0 auto; }
    .core-stratagem-card .header{height:8.2%;}
    .core-stratagem-card .kicker{font-size:3.7cqw}
    .core-stratagem-card .page-title{font-size:3.2cqw; bottom:11%;}
    .core-stratagem-card .content{top:12.2%;bottom:3.2%}
  </style>
</head>
<body>
  <script src="./waha_content_render_utils.js?v=1"></script>
  <div class="toolbar"><label>Show <select id="show"><option value="stratagems">Core stratagems</option></select></label></div>
  <main id="app"></main>
<script>
const DATA_URL='core_stratagems.json', MANIFEST_URL='waha_css_manifest.json';
let DATA={}, MANIFEST={};
const $=s=>document.querySelector(s), app=$('#app');
// colourClass/iconStyle/fieldBlockHtml/fieldHtml/overflowing are shared —
// see waha_content_render_utils.js's "STRATAGEM CARDS" section.
function cardHeader(card,title){
  return `<div class="header"><div class="kicker">${esc(card.faction || 'Core Rules')}</div><div class="page-title">${esc(title)}</div></div>`;
}
function renderCoreStratagem(s){
  const color=colourClass(s.color_class);
  const icons=(s.icon_classes&&s.icon_classes.length?s.icon_classes:['str10Any']);
  const iconHtml = icons.map(i => `<div class="strat-icon" ${iconStyle(i)}></div>`).join('');
  const field = (label, val) => val ? `<div class="strat-field"><span class="label">${label}:</span>${fieldHtml(val)}</div>` : '';
  return `<section class="strat ${color}"><div class="strat-head"><div class="strat-name">${esc(s.name)}</div><div class="strat-cp">${esc(s.cp||'')}</div></div><div class="strat-body"><div class="strat-type">${esc(s.type||'Stratagem')}</div><div class="dotline"></div><div class="strat-text">${field('WHEN',s.when)}${field('TARGET',s.target)}${field('EFFECT',s.effect)}${field('RESTRICTIONS',s.restrictions)}</div></div><div class="strat-icons" ${iconStyle(s.bg_class)}>${iconHtml}</div></section>`;
}
function splitCoreStratagems(strats){
  const leftCount = Math.ceil(strats.length / 2);
  return [strats.slice(0, leftCount), strats.slice(leftCount)];
}
function renderCoreStratagemPage(card, pageStrats, pageIndex, pageCount){
  const [left, right] = splitCoreStratagems(pageStrats);
  const title = pageCount > 1 ? `Core Stratagems ${pageIndex + 1}/${pageCount}` : 'Core Stratagems';
  return `<article class="core-stratagem-card" data-card="stratagems" data-page="${pageIndex + 1}">${cardHeader(card,title)}<div class="content"><div class="core-stratagem-grid"><div class="core-stratagem-col">${left.map(renderCoreStratagem).join('')}</div><div class="core-stratagem-col">${right.map(renderCoreStratagem).join('')}</div></div></div></article>`;
}
// Core stratagems are never bounded by a fixed count-per-page — the whole
// list must fit in AT MOST 2 pages, full stop, however many stratagems
// there are. Order is strict (never reordered), but exactly where the
// split falls between page 1 and page 2 is free to move to whatever gives
// the more comfortable fit on both sides. That "comfortable" judgement
// needs a real measurement, not a guess: this renders each candidate page
// off-screen, runs the actual shrink-to-fit loop on it, and reads back the
// font size it settled on — the same mechanism fitCoreStratagems already
// uses for the real, visible cards.
function measureMinFontSize(pageStrats, card){
  if (!pageStrats.length) return Infinity;
  const scratch = document.createElement('div');
  scratch.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none;left:-9999px;top:0';
  scratch.innerHTML = renderCoreStratagemPage(card, pageStrats, 0, 1);
  document.body.appendChild(scratch);
  const cardEl = scratch.querySelector('.core-stratagem-card');
  fitCoreStratagems(cardEl);
  let minFs = Infinity;
  cardEl.querySelectorAll('.strat').forEach(strat=>{
    const fs = parseFloat(getComputedStyle(strat).getPropertyValue('--strat-fs'));
    if (fs < minFs) minFs = fs;
  });
  scratch.remove();
  return minFs;
}
// Any font size at/above this reads comfortably. Used only to decide
// whether a single page is fine at all — the split search itself always
// checks every candidate and keeps the actual best one, rather than
// stopping at the first "good enough" split, which produced lopsided
// results (e.g. 2 stratagems on page 1, 8 crammed onto page 2, both
// technically "comfortable" but nowhere near the best available balance).
// A full scan is still cheap for what's normally ~10-20 stratagems.
const COMFORTABLE_STRAT_FS = 1.6;
function splitCoreStratagemsForBestFit(strats, card){
  if (strats.length <= 1) return [strats];

  const singleFs = measureMinFontSize(strats, card);
  if (singleFs >= COMFORTABLE_STRAT_FS) return [strats];

  // Font size only ever shrinks from a fixed baseline (never grows past
  // it), so once both sides of a split comfortably fit at full baseline,
  // every split at or beyond that point scores identically — nothing
  // shorter than "fits at max size" can ever score higher. Without a
  // tie-break, the first such split found (e.g. 2 stratagems on page 1,
  // the rest crammed onto page 2) wins arbitrarily, which is "comfortable"
  // by the score but visibly lopsided. Preferring the numerically most
  // balanced split among ties gives the actual best-looking result.
  const mid = strats.length / 2;
  let bestSplit = Math.ceil(mid);
  let bestScore = -Infinity;
  for (let i = 1; i < strats.length; i++){
    const left = strats.slice(0, i), right = strats.slice(i);
    const score = Math.min(measureMinFontSize(left, card), measureMinFontSize(right, card));
    const better = score > bestScore ||
      (score === bestScore && Math.abs(i - mid) < Math.abs(bestSplit - mid));
    if (better){ bestScore = score; bestSplit = i; }
  }
  return [strats.slice(0, bestSplit), strats.slice(bestSplit)];
}
function renderCoreStratagemCards(card){
  const pages = splitCoreStratagemsForBestFit(card.stratagems || [], card);
  return pages.map((pageStrats, pageIndex) => renderCoreStratagemPage(card, pageStrats, pageIndex, pages.length)).join('');
}
// fitStratagemGrid is shared — see waha_content_render_utils.js.
function fitCoreStratagems(card){ fitStratagemGrid(card, '.core-stratagem-grid'); }
function fitAll(){ document.querySelectorAll('.core-stratagem-card').forEach(fitCoreStratagems); }
function stratCardFilename(card){ return `${DATA.faction || 'core'}-stratagems-${card.dataset.page || '1'}`; }
function attachExportUi(){
  addDownloadAllButton($('.toolbar'), () => document.querySelectorAll('.core-stratagem-card'), stratCardFilename);
}
function render(){ app.innerHTML = renderCoreStratagemCards(DATA); attachExportUi(); requestAnimationFrame(()=>{fitAll(); requestAnimationFrame(fitAll);}); }
Promise.all([fetch(DATA_URL).then(r=>r.json()), fetch(MANIFEST_URL).then(r=>r.json()).catch(()=>{})]).then(([d,m])=>{DATA=d;MANIFEST=m;setActiveManifest(MANIFEST);render();});
</script>
</body>
</html>
