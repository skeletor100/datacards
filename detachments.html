<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Detachment Card Renderer</title>
  <link rel="stylesheet" href="./waha_common.css?v=1" />
  <style>
    :root{
      --card-w:1800px; --card-h:1200px; --strat-card-w:1200px; --strat-card-h:1800px; --paper:#ece9df; --ink:#111; --banner:#084563;
      --frame:#4b6262; --green:#22796c; --blue:#096691; --red:#bf0d12;
      --font:"Conduit ITC","ConduitITC","Bahnschrift Condensed","Aptos Narrow","Arial Narrow",Arial,sans-serif;
    }
    *{box-sizing:border-box} body{margin:0;background:#242424;color:var(--ink);font-family:var(--font);padding:24px}
    .toolbar{max-width:var(--strat-card-w);margin:0 auto 16px;color:#ddd;font:14px Arial,sans-serif;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar select{padding:6px 8px}.toolbar label{display:flex;gap:6px;align-items:center}
    #app{width:min(96vw,var(--strat-card-w));margin:0 auto;display:grid;gap:24px}.hidden{display:none!important}
    .detachment-card {
        width: 1200px;
        height: 1800px;
        background: var(--paper);
        border: 4px solid var(--frame);
        position: relative;
        overflow: hidden;
        container-type: inline-size;
        box-shadow: 0 12px 40px rgba(0,0,0,.45);
    }
    .detachment-card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 18% 22%,rgba(255,255,255,.35),transparent 28%),linear-gradient(90deg,rgba(0,0,0,.035),transparent 20%,transparent 80%,rgba(0,0,0,.07));pointer-events:none}
    .header{position:absolute;left:4%;right:4%;top:3%;height:10.2%;background:var(--banner);color:#fff;padding:0 1.55%;text-transform:uppercase;font-weight:900;letter-spacing:.035em;line-height:.95}.header::after{content:"";position:absolute;left:1.55%;right:1.55%;top:50%;height:.42cqw;background:#fff;transform:translateY(-50%)}
    /* A long faction/detachment name (e.g. "Agents of the Imperium - Ordo
       Hereticus Purgation Force") has no natural line-break point here, and
       .kicker was never constrained to one line — it would wrap and grow
       downward into .page-title's own space below it (both are absolutely
       positioned in the same .header box), the two overlapping into an
       unreadable jumble. white-space:nowrap plus overflow:hidden as a static
       safety net, with fitKicker() scaling .kicker-text down at render time
       to actually fit the available width instead of just clipping it. */
    .kicker{position:absolute;left:1.55%;right:1.55%;top:12%;font-size:2.26cqw;line-height:1;white-space:nowrap;overflow:hidden}
    .kicker-text{display:inline-block;transform-origin:left center}
    .page-title{position:absolute;left:1.55%;right:1.55%;line-height:.9}
    .rule-card,
    .strat-card {
        margin: 0 auto;
    }
    .rule-card .header{
      height:8.2%;
    }
    .rule-card .kicker{
      font-size:4.2cqw;
    }
    .rule-card .page-title{
      font-size:3.9cqw;
      bottom:11%;
    }
    .strat-card .page-title{font-size:3.4cqw; bottom:11%;}
    .content{position:absolute;left:4%;right:4%;top:16%;bottom:4%;overflow:hidden}
    .section-title{background:var(--frame);color:white;text-transform:uppercase;font-weight:900;letter-spacing:.04em;font-size:3.0cqw;padding:.35cqw 1cqw;margin-bottom:.75cqw}
    .rule-body{font:var(--rule-fs,2.4cqw)/1.20 var(--font)}
    .rule-name,
    .enh-name{font-weight:900;text-transform:uppercase;font-size:calc(var(--enh-fs,2.15cqw) * 1.5);letter-spacing:.02em;margin:.35cqw 0 .14cqw}
    /* New this edition: some enhancements carry a small "UPGRADE" badge
       next to their name (see waha_detachment_scraper.extract_enhancements'
       upgrade_label). Fixed colours captured from the live site
       (background rgb(57,77,14), text rgb(242,242,242)) — unlike the
       heading banners elsewhere in this project, this badge isn't a
       per-faction colour, so a hardcoded value is correct here rather
       than a captured/resolved one. */
    .enh-upgrade-badge{display:inline-block;background:#394d0e;color:#f2f2f2;font-weight:700;text-transform:uppercase;font-size:calc(var(--enh-fs,2.15cqw) * .68);letter-spacing:.02em;padding:.12cqw .3cqw .02cqw;margin-left:.3cqw;vertical-align:middle}
    .subrule-title{font-weight:900;text-transform:uppercase;font-size:calc(var(--rule-fs,2.4cqw) * 1.15);margin:.55cqw 0 .08cqw}.enh-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:2.0cqw}.enh-col{display:flex;flex-direction:column;gap:.85cqw}.enh-card{border-top:.18cqw dotted #222;padding-top:.32cqw;min-width:0}
    .enh-text{font:var(--enh-fs,2.15cqw)/1.16 var(--font)}
    /* New this edition: an enhancement can grant a specific weapon profile
       (see waha_detachment_scraper.extract_enhancement_weapon_profile) —
       a compact single-row stat line, not the fuller multi-weapon table
       units.html renders for a whole datasheet (profile markers for
       split weapon options don't apply here, since there's only ever one
       profile). */
    .enh-weapon-table{width:100%;border-collapse:collapse;margin-top:.3cqw;font-size:calc(var(--enh-fs,2.15cqw) * .82)}
    .enh-weapon-table th{background:var(--frame);color:#fff;text-transform:uppercase;font-weight:900;text-align:left;padding:.14cqw .3cqw;letter-spacing:.02em}
    .enh-weapon-table th:not(:first-child),.enh-weapon-table td:not(:first-child){text-align:center}
    .enh-weapon-table td{padding:.16cqw .3cqw;border-bottom:.06cqw solid #999}
    .enh-weapon-keywords{font-weight:700;opacity:.75}
    .rule-table,
    .content-table{
      width:100%;
      border-collapse:collapse;
      margin:.35cqw 0;
      font:inherit;
    }

    .rule-table td,
    .content-table td{
      padding:.08cqw .6cqw .08cqw 0;
      font-weight:900;
      text-transform:uppercase;
    }
     p{margin:.30cqw 0}
    .rule-card .content{
      top:12.2%;
      bottom:3.2%;
      display:grid;
      grid-template-rows:var(--rules-row, auto) minmax(0, 1fr);
      gap:1.1cqw;
    }
    .rules-zone,
    .enh-zone{
      min-height:0;
      overflow:hidden;
      position:relative;
    }
    .rules-fit,
    .enh-fit{
      transform-origin:top left;
      width:100%;
    }
    .enh-zone{
      display:grid;
      grid-template-rows:auto minmax(0,1fr);
    }
    .strat-card .header{height:8.2%;}.strat-card .kicker{font-size:3.7cqw}.strat-card .page-title{font-size:3.2cqw}.strat-card .content{top:12.2%;bottom:3.2%}
    .strat-grid{
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 2.3cqw;
      align-items: start;
      height: 100%;
      overflow: hidden;
    }
    .strat-col{
      display: flex;
      flex-direction: column;
      gap: 1.5cqw;
      min-width: 0;
    }
  </style>
</head>
<body>
  <script src="./waha_content_render_utils.js?v=1"></script>
  <div class="toolbar"><label>Faction <select id="faction-primary"></select></label><label id="sub-faction-row" class="hidden">Sub-Faction <select id="sub-faction"></select></label><label>Detachment <select id="detachment"></select></label><label>Show <select id="show"><option value="all">Both cards</option><option value="rules">Rules card</option><option value="stratagems">Stratagems card</option></select></label></div>
  <main id="app"></main>
<script>

let detachmentIndex = [];

function allDetachmentCards(){
  const rows = [];

  for (const [factionName, factionData] of Object.entries(DATA || {})) {
    addDetachmentCards(rows, factionName, 'None', factionData);

    for (const [subFactionName, subFactionData] of Object.entries(factionData || {})) {
      if (subFactionName === 'unit_cards') continue;
      if (subFactionName === 'detachment_cards') continue;

      if (subFactionData && typeof subFactionData === 'object' && subFactionData.detachment_cards) {
        addDetachmentCards(rows, factionName, subFactionName, subFactionData);
      }
    }
  }

  return rows;
}

function addDetachmentCards(rows, factionName, subFactionName, factionData) {
  const cards = factionData?.detachment_cards || {};

  for (const [detachmentKey, card] of Object.entries(cards)) {
    rows.push({
      factionName,
      subFactionName,
      detachmentKey,
      detachment: card.detachment || detachmentKey,
      card
    });
  }
}

function populate(){
  detachmentIndex = allDetachmentCards();

  const factionValues = [...new Set(detachmentIndex.map(x => x.factionName))]
    .sort();

  $('#faction-primary').innerHTML = factionValues
    .map(v => `<option value="${esc(v)}">${esc(v)}</option>`)
    .join('');

  updateSubFactions();
}

function updateSubFactions(){
  const factionName = $('#faction-primary').value;

  const matches = detachmentIndex.filter(x => x.factionName === factionName);

  const subFactionValues = [...new Set(matches.map(x => x.subFactionName))]
    .sort((a, b) => {
      if (a === 'None') return -1;
      if (b === 'None') return 1;
      return a.localeCompare(b);
    });

  $('#sub-faction').innerHTML = subFactionValues
    .map(v => `<option value="${esc(v)}">${esc(v)}</option>`)
    .join('');

  $('#sub-faction-row').classList.toggle(
    'hidden',
    subFactionValues.length <= 1 && subFactionValues[0] === 'None'
  );

  updateDets();
}

function updateDets(){
  const factionName = $('#faction-primary').value;
  const subFactionName = $('#sub-faction').value || 'None';

  const matches = detachmentIndex
    .filter(x =>
      x.factionName === factionName &&
      x.subFactionName === subFactionName
    )
    .sort((a, b) => a.detachment.localeCompare(b.detachment));

  $('#detachment').innerHTML = matches
    .map((x, i) => `<option value="${i}">${esc(x.detachment)}</option>`)
    .join('');

  $('#detachment')._matches = matches;

  render();
}

function selectedCard(){
  const matches = $('#detachment')._matches || [];
  const selected = matches[Number($('#detachment').value)];
  return selected?.card || null;
}

const DATA_URL='waha_data.json', MANIFEST_URL='waha_css_manifest.json';
let DATA={}, MANIFEST={};
const $=s=>document.querySelector(s), app=$('#app');
// Generic content rendering helpers are provided by waha_content_render_utils.js.

function detachmentCardFilename(card){
  const detName = $('#detachment').selectedOptions?.[0]?.textContent || 'detachment';
  return `${detName}-${card.dataset.card || 'card'}`;
}

function attachExportUi(){
  addDownloadAllButton(
    $('.toolbar'),
    () => document.querySelectorAll('.detachment-card:not(.hidden)'),
    detachmentCardFilename
  );
}

function render(){
  const card = selectedCard();

  if (!card) {
    app.innerHTML = '';
    return;
  }

  app.innerHTML = renderRules(card) + renderStrats(card);
  applyShow();
  attachExportUi();
}
// colourClass/iconStyle/fieldBlockHtml/fieldHtml/overflowing are shared —
// see waha_content_render_utils.js's "STRATAGEM CARDS" section.
function headingStyle(heading){
    return `color:${heading?.color || '#fff'}${heading?.background ? `;background:${heading.background}` : ''}`;
}
function cardHeader(card,title){
    const bannerStyle = headingStyle(card.rules?.[0]?.heading);

    return `
    <div class="header" style="${bannerStyle}">
        <div class="kicker"><span class="kicker-text">${esc(card.faction)} - ${esc(card.detachment)}</span></div>
        <div class="page-title">${title}</div>
    </div>`;
}
function renderRules(card){
  const bannerStyle = headingStyle(card.rules?.[0]?.heading);

  const rules = (card.rules || []).map(r => `
    <section>
      <div class="section-title" style="${headingStyle(r.heading)}">
        ${esc(r.name)}
      </div>
      <div class="rule-body">
        ${(r.content || []).map(blockHtml).join('')}
      </div>
    </section>
  `).join('');

  const enhancements = card.enhancements || [];
  const leftCount = Math.ceil(enhancements.length / 2);
  const left = enhancements.slice(0, leftCount);
  const right = enhancements.slice(leftCount);
  const renderEnhWeaponProfile = w => {
    if (!w) return '';
    const hitKey = w.type === 'ranged' ? 'BS' : 'WS';
    const keywords = Array.isArray(w.keywords) && w.keywords.length
      ? ` <span class="enh-weapon-keywords">[${esc(w.keywords.map(k => String(k).toUpperCase()).join(', '))}]</span>`
      : '';
    return `
      <table class="enh-weapon-table">
        <thead><tr><th>${esc(w.type === 'ranged' ? 'RANGED WEAPONS' : 'MELEE WEAPONS')}</th><th>RANGE</th><th>A</th><th>${esc(hitKey)}</th><th>S</th><th>AP</th><th>D</th></tr></thead>
        <tbody><tr><td>${esc(w.name)}${keywords}</td><td>${esc(w.range)}</td><td>${esc(w.A)}</td><td>${esc(w[hitKey])}</td><td>${esc(w.S)}</td><td>${esc(w.AP)}</td><td>${esc(w.D)}</td></tr></tbody>
      </table>
    `;
  };
  const upgradeBadge = e => e.upgrade_label
    ? ` <span class="enh-upgrade-badge">${esc(e.upgrade_label)}</span>`
    : '';
  const renderEnh = e => `
    <div class="enh-card">
      <div class="enh-name">${esc(e.name)}${upgradeBadge(e)}</div>
      <div class="enh-text">${(e.content || []).map(blockHtml).join('')}</div>
      ${renderEnhWeaponProfile(e.weapon_profile)}
    </div>
  `;

  return `
    <article class="detachment-card rule-card" data-card="rules">
      ${cardHeader(card,'Detachment Rules')}
      <div class="content">
        <div class="rules-zone">
          <div class="rules-fit">${rules}</div>
        </div>
        <div class="enh-zone">
          <div class="section-title" style="${bannerStyle}">Enhancements</div>
          <div class="enh-fit">
            <div class="enh-grid"><div class="enh-col">${left.map(renderEnh).join('')}</div><div class="enh-col">${right.map(renderEnh).join('')}</div></div>
          </div>
        </div>
      </div>
    </article>
  `;
}
function renderStrat(s,det){
  const color=colourClass(s.color_class);
  const icons=(s.icon_classes&&s.icon_classes.length?s.icon_classes:['str10Any']);
  const iconHtml = icons.map(i => `<div class="strat-icon" ${iconStyle(i)}></div>`).join('');
  const field = (label, val) =>
    val
      ? `<div class="strat-field"><span class="label">${label}:</span>${fieldHtml(val)}</div>`
      : '';
  return `<section class="strat ${color}"><div class="strat-head"><div class="strat-name">${esc(s.name)}</div><div class="strat-cp">${esc(s.cp||'')}</div></div><div class="strat-body"><div class="strat-type">${esc(det)} – ${esc(s.type||'Stratagem')}</div><div class="dotline"></div><div class="strat-text">${field('WHEN',s.when)}${field('TARGET',s.target)}${field('EFFECT',s.effect)}${field('RESTRICTIONS',s.restrictions)}</div></div><div class="strat-icons" ${iconStyle(s.bg_class)}>${iconHtml}</div></section>`;
}
function splitStrats(strats){
  const leftCount = Math.ceil(strats.length / 2);

  return [
    strats.slice(0, leftCount),
    strats.slice(leftCount)
  ];
}
function renderStrats(card){
  const strats = card.stratagems || [];
  if (!strats.length) return '';

  const [left, right] = splitStrats(strats);

  return `
    <article class="detachment-card strat-card" data-card="stratagems">
      ${cardHeader(card,'Stratagems')}
      <div class="content">
        <div class="strat-grid">
          <div class="strat-col">
            ${left.map(s => renderStrat(s, card.detachment)).join('')}
          </div>
          <div class="strat-col">
            ${right.map(s => renderStrat(s, card.detachment)).join('')}
          </div>
        </div>
      </div>
    </article>
  `;
}
function pxToCqw(card, px){ return (px / card.getBoundingClientRect().width) * 100; }
function fitBox(box, inner, availableHOverride){
  if (!box || !inner) return;

  inner.style.transform = '';
  inner.style.width = '100%';

  const availableW = box.clientWidth;
  const availableH = availableHOverride != null ? availableHOverride : box.clientHeight;

  const neededW = inner.scrollWidth;
  let neededH = inner.scrollHeight;

  const enhCols = inner.querySelectorAll('.enh-col');
  if (enhCols.length) {
    neededH = Math.max(...Array.from(enhCols, col => col.scrollHeight));
  }

  if (!availableW || !availableH || !neededW || !neededH) return;

  const scale = Math.min(
    1,
    availableW / neededW,
    availableH / neededH
  );

  inner.style.transform = `scale(${scale})`;

  const isEnhancements = inner.querySelector('.enh-col');
  if (isEnhancements) {
    inner.style.width = '100%';
  } else {
    inner.style.width = `${100 / scale}%`;
  }
}

/* Redistributes the children of two column elements to minimize the
   tallest column's natural (unscaled) height, while preserving overall
   order — reading col1 top-to-bottom then col2 top-to-bottom must still
   give back the original sequence. Since it's a single contiguous split
   point over an ordered sequence, trying every possible cut and keeping
   the one with the smallest "tallest side" is optimal (not just a
   heuristic), and is O(n) after the heights are measured. */
function balanceTwoColumns(col1, col2) {
  if (!col1 || !col2) return;

  const items = [...Array.from(col1.children), ...Array.from(col2.children)];
  const n = items.length;
  if (!n) return;

  const heights = items.map(el => el.getBoundingClientRect().height);
  const prefix = [0];
  for (let i = 0; i < n; i++) prefix.push(prefix[i] + heights[i]);
  const total = prefix[n];

  let bestIdx = n;
  let bestWorst = Infinity;
  for (let i = 0; i <= n; i++) {
    const worst = Math.max(prefix[i], total - prefix[i]);
    if (worst < bestWorst) {
      bestWorst = worst;
      bestIdx = i;
    }
  }

  // Don't leave a column completely empty just because that happens to
  // minimize the max — with 2+ items a visibly empty column looks broken
  // even in the rare case it's technically optimal.
  if (n > 1) {
    bestIdx = Math.min(Math.max(bestIdx, 1), n - 1);
  }

  col1.replaceChildren(...items.slice(0, bestIdx));
  col2.replaceChildren(...items.slice(bestIdx));
}

function fitRulesCard(card){
  card.style.setProperty('--rule-fs','2.4cqw');
  card.style.setProperty('--enh-fs','2.15cqw');

  const content = card.querySelector('.content');
  const rulesZone = card.querySelector('.rules-zone');
  const rulesFit = card.querySelector('.rules-fit');
  const enhZone = card.querySelector('.enh-zone');
  const enhFit = card.querySelector('.enh-fit');
  const enhTitle = enhZone?.querySelector('.section-title');
  const enhCols = enhFit?.querySelectorAll(':scope > .enh-grid > .enh-col');

  if (!content || !rulesZone || !rulesFit || !enhZone || !enhFit) return;

  rulesFit.style.transform = '';
  rulesFit.style.width = '100%';
  enhFit.style.transform = '';
  enhFit.style.width = '100%';

  if (enhCols && enhCols.length === 2) {
    balanceTwoColumns(enhCols[0], enhCols[1]);
  }

  card.style.setProperty('--rules-row', 'auto');

  const contentH = content.clientHeight;
  const gap = parseFloat(getComputedStyle(content).rowGap) || 0;
  const naturalRulesH = rulesFit.scrollHeight;

  const minEnhH = Math.max(
    contentH * 0.34,
    (enhTitle?.offsetHeight || 0) + 160
  );

  const maxRulesH = Math.max(0, contentH - gap - minEnhH);
  const rulesH = Math.min(naturalRulesH, maxRulesH);

  card.style.setProperty('--rules-row', `${rulesH}px`);

  fitBox(rulesZone, rulesFit);

  // enhZone.clientHeight includes the "Enhancements" title bar above
  // enh-fit, so using it directly as the available height overestimates
  // how much room enh-fit actually has (the title isn't part of enh-fit's
  // own grid row) and under-shrinks the content, letting it get clipped.
  // Subtract the title's height to get enh-fit's real budget.
  const enhAvailableH = enhZone.clientHeight - (enhTitle?.offsetHeight || 0);
  fitBox(enhZone, enhFit, enhAvailableH);
}
// fitStratagemGrid is shared — see waha_content_render_utils.js.
function fitStratagems(card){ fitStratagemGrid(card, '.strat-grid'); }
function fitKicker(card){
  const kicker = card.querySelector('.kicker');
  const inner = kicker?.querySelector('.kicker-text');
  if (!kicker || !inner) return;

  inner.style.transform = '';

  const availableW = kicker.clientWidth;
  const neededW = inner.scrollWidth;
  if (!availableW || !neededW) return;

  const scale = Math.min(1, availableW / neededW);
  if (scale < 1) inner.style.transform = `scale(${scale})`;
}
function fitAll(){
  document.querySelectorAll('.detachment-card').forEach(fitKicker);
  document.querySelectorAll('.rule-card').forEach(fitRulesCard);
  document.querySelectorAll('.strat-card').forEach(fitStratagems);
}
function applyShow(){
  const v = $('#show').value;

  document.querySelectorAll('.detachment-card').forEach(c =>
    c.classList.toggle('hidden', v !== 'all' && c.dataset.card !== v)
  );

  requestAnimationFrame(() => {
    fitAll();
    requestAnimationFrame(fitAll);
  });
}
$('#faction-primary').addEventListener('change', updateSubFactions); $('#sub-faction').addEventListener('change', updateDets); $('#detachment').addEventListener('change', render); $('#show').addEventListener('change', applyShow);
Promise.all([fetch(DATA_URL).then(r=>r.json()), fetch(MANIFEST_URL).then(r=>r.json()).catch(()=>({}))]).then(([d,m])=>{DATA=d;MANIFEST=m;setActiveManifest(MANIFEST);populate();});
</script>
</body>
</html>
