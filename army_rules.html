<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Army Rules Card Renderer</title>
  <link rel="stylesheet" href="./waha_common.css?v=1" />
  <style>
    :root{
      --card-w:1800px; --card-h:1200px; --strat-card-w:1200px; --strat-card-h:1800px; --paper:#ece9df; --ink:#111; --banner:#084563;
      --frame:#4b6262; --green:#22796c; --blue:#096691; --red:#bf0d12;
      --font:"Conduit ITC","ConduitITC","Bahnschrift Condensed","Aptos Narrow","Arial Narrow",Arial,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:#242424;color:var(--ink);font-family:var(--font);padding:24px}
    .toolbar{max-width:var(--strat-card-w);margin:0 auto 16px;color:#ddd;font:14px Arial,sans-serif;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .toolbar select,.toolbar button{padding:6px 8px}
    .toolbar label{display:flex;gap:6px;align-items:center}
    #app{width:min(96vw,var(--strat-card-w));margin:0 auto;display:grid;gap:24px}
    .hidden{display:none!important}

    .detachment-card{
      width:1200px;
      height:1800px;
      background:var(--paper);
      border:4px solid var(--frame);
      position:relative;
      overflow:hidden;
      container-type:inline-size;
      box-shadow:0 12px 40px rgba(0,0,0,.45);
    }
    .detachment-card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 18% 22%,rgba(255,255,255,.35),transparent 28%),linear-gradient(90deg,rgba(0,0,0,.035),transparent 20%,transparent 80%,rgba(0,0,0,.07));pointer-events:none}
    .header{position:absolute;left:4%;right:4%;top:3%;height:8.2%;background:var(--banner);color:#fff;padding:0 1.55%;text-transform:uppercase;font-weight:900;letter-spacing:.035em;line-height:.95}
    .header::after{content:"";position:absolute;left:1.55%;right:1.55%;top:50%;height:.42cqw;background:#fff;transform:translateY(-50%)}
    .kicker{position:absolute;left:1.55%;right:1.55%;top:12%;font-size:3.7cqw;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:clip}
    .page-title{position:absolute;left:1.55%;right:1.55%;bottom:11%;font-size:3.2cqw;line-height:.9}

    .army-rules-card .content{position:absolute;left:4%;right:4%;top:12.2%;bottom:3.2%;overflow:hidden}
    .army-rules-fit{transform-origin:top left;width:100%}
    .section-title{background:var(--frame);color:white;text-transform:uppercase;font-weight:900;letter-spacing:.04em;font-size:3.0cqw;padding:.35cqw 1cqw;margin:0 0 .75cqw}
    .army-rule{break-inside:avoid;margin:0 0 1.05cqw}
    .rule-body{font:var(--rule-fs,2.4cqw)/1.20 var(--font)}
    .subrule-title{font-weight:900;text-transform:uppercase;font-size:calc(var(--rule-fs,2.4cqw) * 1.15);margin:.55cqw 0 .08cqw}
    .impact18{font-weight:900;text-transform:uppercase;font-size:calc(var(--rule-fs,2.4cqw) * 1.22);letter-spacing:.02em}

    .cs-rule{display:grid;grid-template-columns:minmax(5.5cqw,auto) 1fr;column-gap:.85cqw;align-items:start;border-top:.18cqw dotted #222;padding-top:.45cqw;margin:.55cqw 0 .7cqw;break-inside:avoid}
    .cs-req{min-width:5.5cqw;min-height:4.2cqw;display:flex;align-items:center;justify-content:center;font-weight:900;text-transform:uppercase;font-size:1.55cqw;line-height:1}
    .cs-content{min-width:0}
    .cs-title{font-weight:900;text-transform:uppercase;font-size:calc(var(--rule-fs,2.4cqw) * 1.05);letter-spacing:.02em;margin:0 0 .12cqw}
    .cruD6wrap{display:inline-flex;align-items:center;justify-content:center;min-width:6.4cqw;min-height:6.4cqw;font-weight:900}
    .cruD1,.cruD2,.cruD3,.cruD4,.cruD5,.cruD6,
    .cruD1::before,.cruD2::before,.cruD3::before,.cruD4::before,.cruD5::before,.cruD6::before,
    .cruD1::after,.cruD2::after,.cruD3::after,.cruD4::after,.cruD5::after,.cruD6::after {
      width:5.0cqw !important;
      height:5.0cqw !important;
      background-size:contain !important;
    }
    .content-list{margin:.35cqw 0 .55cqw 1.8cqw;padding:0}
    .content-list li{margin:.16cqw 0}
    .li-title{font-weight:900;text-transform:uppercase}
    .rule-table,.content-table{width:100%;border-collapse:collapse;margin:.35cqw 0;font:inherit}
    .rule-table td{padding:.08cqw .6cqw .08cqw 0;font-weight:900;text-transform:uppercase}
    .content-table td{padding:.08cqw .6cqw .08cqw 0;vertical-align:top}
    .content-table p{margin:.20cqw 0;text-transform:none;font-weight:400}
    .content-table p.impact18{font-weight:900;text-transform:uppercase;line-height:1.05;margin:.08cqw 0 .24cqw;white-space:nowrap;overflow-wrap:normal;word-break:keep-all;hyphens:none;max-width:none;width:max-content;display:block}
    .content-table p.impact18 span{white-space:nowrap;overflow-wrap:normal;word-break:keep-all}
    .content-table td:has(> p.impact18){min-width:max-content;overflow:visible}

    /* Targeted shim for preserved Wahapedia warp-charge widgets.
       The manifest supplies the real cruWarpChargeTS background image; this CSS
       only controls card-local sizing/positioning and readable text colour.
       Not scoped to .content-table: these widgets can now also appear inside a
       subrule box (extract_subrule_from_table), not just a literal table. */
    .cruWarpChargeWrap{position:relative!important;display:block!important;width:100%!important;min-width:0!important;height:1.72em!important;min-height:1.72em!important;margin:.20cqw 0 .40cqw!important;background:rgb(0,60,112)!important;color:rgb(192,217,236)!important;overflow:visible!important;font-size:calc(var(--rule-fs,2.4cqw) * .82)!important;line-height:1!important;font-weight:900!important;text-transform:uppercase!important}
    .cruWarpChargeName{position:absolute!important;left:.55em!important;top:50%!important;transform:translateY(-50%)!important;color:rgb(192,217,236)!important;font-size:1.08em!important;line-height:1!important;white-space:nowrap!important}
    .cruWarpChargeName span{color:inherit!important;font-size:inherit!important;line-height:inherit!important}
    .cruWarpChargeTS{position:absolute!important;right:-.10em!important;top:50%!important;transform:translateY(-50%)!important;width:2.25em!important;height:2.42em!important;background-color:transparent!important;background-size:contain!important;background-repeat:no-repeat!important;background-position:center!important;color:rgb(192,217,236)!important;display:flex!important;align-items:center!important;justify-content:center!important;line-height:1!important;overflow:visible!important}
    .cruWarpChargeTSNumber{display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;height:100%!important;color:rgb(192,217,236)!important;font-size:1.42em!important;line-height:1!important;font-weight:900!important;text-align:center!important;text-shadow:0 1px 1px rgba(0,0,0,.45)!important}
    .cruWarpChargeTSNumber span{color:inherit!important;font-size:inherit!important;line-height:inherit!important}

    /* World Eaters dice-requirement widget wrapper (cruWEwrap). The die/
       plus/or icons inside it now bring their own real display:inline-block
       (captured live, see STAMP_JS's `measured.display`), so they already
       flow left-to-right correctly with no per-class CSS needed here.
       cruWEwrap itself isn't a widget marker, so it still picks up the
       manifest's auto-generated CSS (see applyManifestAssetCss) — which
       sampled it in isolation with no children and captured a meaningless
       width:8px (just its own padding). Unlike display, that raw width has
       no valid reuse here (it's Wahapedia's own content-column width, not
       a portable design constant), so it's overridden with auto rather
       than captured. */
    .cruWEwrap{width:auto!important}

    /* Action-entry icon rail: one or more redDiamondLeft widgets define the
       left margin for the following TRIGGER/EFFECT text. Not scoped to
       .content-table: this content can now also render inside a subrule box
       (extract_subrule_from_table), not just a literal table. */
    .action-entry{display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:.62cqw;align-items:start;margin:.25cqw 0 .42cqw;clear:both}
    .action-icons{display:flex;gap:.27cqw;align-items:flex-start;justify-content:flex-start;min-width:max-content;padding-top:.05cqw}
    .action-icons-standalone{margin:.25cqw 0 .35cqw}
    .action-icon-unit{display:flex;align-items:center;justify-content:center;overflow:visible}
    .action-text{min-width:0}
    .action-text p{margin:0 0 .38cqw;text-transform:none;font-weight:400}
    .action-text p:last-child{margin-bottom:0}

    /* Datasheet-character chips used by Astra Militarum Orders.
       Render them as a reserved left rail instead of relying on source-page floats. */
    .ds-char-entry{display:grid;grid-template-columns:7.2cqw minmax(0,1fr);column-gap:.70cqw;align-items:start;width:100%;max-width:100%;clear:both;margin:.85cqw 0 .8cqw;min-height:5.8cqw;padding-bottom:.25cqw;}
    .ds-char-entry:has(.dsCharWrap + .dsCharWrap){grid-template-columns:14.2cqw minmax(0,1fr)}
    .ds-char-icons{display:flex;gap:.45cqw;align-items:flex-start;justify-content:flex-start;width:7.2cqw;min-width:0;max-width:7.2cqw;overflow:visible}
    .ds-char-entry:has(.dsCharWrap + .dsCharWrap) .ds-char-icons{width:14.2cqw;max-width:14.2cqw}
    .ds-char-entry .dsCharWrap{float:none!important;display:block!important;padding:0!important;margin:0!important;width:6.6cqw!important;min-width:6.6cqw!important;max-width:6.6cqw!important;overflow:visible!important}
    .ds-char-text{min-width:0;max-width:100%;overflow-wrap:normal}
    .ds-char-text p{margin:0 0 .38cqw;text-transform:none;font-weight:400}
    .ds-char-text p:last-child{margin-bottom:0}

    /* Scoped reconstruction of Wahapedia datasheet-character chips.
       This only applies to dsChar clusters rendered by the ds-char-entry path. */
    .ds-char-entry .dsCharWrap{
      float:none!important;
      display:block!important;
      padding:0!important;
      margin:0!important;
      font-family:ConduitITC,"Conduit ITC","Bahnschrift Condensed","Aptos Narrow","Arial Narrow",Arial,sans-serif!important;
      line-height:1!important;
    }
    /* width/height/min-width/min-height are NOT !important here (unlike the
       rest of this rule) — these are fallback defaults only. When the scrape
       captured this element's real live size (block.measured, see
       waha_scraper_common.py's STAMP_JS), the renderer emits it as an inline
       style, which should win over these stale hand-typed pixels. Data
       re-scraped after a source-page redesign self-corrects instead of
       silently going wrong again. */
    .ds-char-entry .dsCharFrame{
      display:flex!important;
      flex-direction:column!important;
      align-items:center!important;
      justify-content:flex-start!important;
      width:45px;
      height:57px;
      min-width:45px;
      min-height:57px;
      background-color:rgb(50,73,53)!important;
      clip-path:polygon(12% 0,100% 0,100% 20%,100% 88%,88% 100%,20% 100%,0 100%,0 12%)!important;
      overflow:hidden!important;
      line-height:1!important;
      box-sizing:border-box!important;
    }
    .ds-char-entry .dsCharFrameBack{
      display:flex!important;
      align-items:center!important;
      justify-content:center!important;
      width:39px;
      height:36px;
      min-width:39px;
      min-height:36px;
      margin-bottom:3px;
      background:rgb(231,233,225)!important;
      clip-path:polygon(10% 0,100% 0,100% 20%,100% 90%,90% 100%,20% 100%,0 100%,0 10%)!important;
      overflow:hidden!important;
      box-sizing:border-box!important;
    }
    .ds-char-entry .dsCharName{
      display:flex!important;
      align-items:center!important;
      justify-content:center!important;
      width:100%!important;
      height:18px!important;
      min-height:18px!important;
      color:#fff!important;
      font-size:18px!important;
      font-weight:900!important;
      line-height:18px!important;
      text-align:center!important;
      white-space:nowrap!important;
      overflow:hidden!important;
      box-sizing:border-box!important;
    }
    .ds-char-entry .dsCharValue{
      display:flex!important;
      align-items:center!important;
      justify-content:center!important;
      width:100%!important;
      height:31px!important;
      min-height:31px!important;
      color:rgb(50,73,53)!important;
      font-size:31px!important;
      font-weight:900!important;
      line-height:31px!important;
      text-align:center!important;
      white-space:nowrap!important;
      overflow:hidden!important;
      box-sizing:border-box!important;
    }
    .ds-char-entry .dsCharName span,
    .ds-char-entry .dsCharValue span{
      display:contents!important;
      color:inherit!important;
      font:inherit!important;
      line-height:inherit!important;
      white-space:inherit!important;
    }


    /* Targeted visual shim for Wahapedia action icons. width/height/margin
       are NOT !important throughout this section (unlike display/position/
       background/etc, which stay structural constants): the renderer now
       derives each of these from the widget's real measured proportions,
       scaled uniformly from one hand-chosen anchor size (see
       WIDGET_ANCHOR_WIDTHS / scaledMeasuredCss in
       waha_content_render_utils.js), so internal spacing/position stays
       correct at any scale instead of drifting the way separately hand-typed
       cqw guesses for every nested piece did. These px/cqw values remain
       only as a fallback for data scraped before this existed. */
    .redDiamondLeft{position:relative!important;display:flex!important;align-items:center!important;justify-content:center!important;width:2.75cqw;height:3.55cqw;min-width:2.75cqw;min-height:3.55cqw;margin:0;overflow:visible!important;background:transparent!important;line-height:1!important}
    .bluCircle2{position:relative!important;display:flex!important;align-items:center!important;justify-content:center!important;width:2.20cqw;height:3.12cqw;border-radius:50%;background-color:rgb(22,105,114)!important;overflow:hidden!important;background-position:center!important;background-repeat:no-repeat!important;background-size:contain!important}
    .bluCircle2 > div[class^="ae"]{display:flex!important;align-items:center!important;justify-content:center!important;width:1.55cqw;height:1.55cqw;background-position:center!important;background-repeat:no-repeat!important;background-size:contain!important;color:#fff!important;line-height:1!important}
    .bluCircle2 > div[class^="ae"]::before,
    .bluCircle2 > div[class^="ae"]::after{display:block!important;width:1.55cqw!important;height:1.55cqw!important;background-position:center!important;background-repeat:no-repeat!important;background-size:contain!important}

    /* Icon-rail wrapper: sized to its child now that the child's own width/
       height come directly from real measured data scaled to the chosen
       anchor (WIDGET_ANCHOR_WIDTHS.redDiamondLeft), so it no longer needs
       its own separate scale guess or a transform to blow the icon up. */
    .action-entry .action-icon-unit {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }

    .action-entry .redDiamondLeft {
      position: relative !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: 2em;
      height: 3.6em;
      min-width: 2em;
      min-height: 3.6em;
      margin: 0;
      overflow: visible !important;
      background: transparent !important;
      line-height: 1 !important;
    }

    /* Inner blue oval/circle. */
    .action-entry .bluCircle2 {
      position: relative !important;
      z-index: 1;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: 2em;
      height: 3em;
      border-radius: 50%;
      background-color: rgb(22,105,114) !important;
      overflow: hidden !important;
      background-position: center !important;
      background-repeat: no-repeat !important;
      background-size: contain !important;
    }

    /* Inner glyph, e.g. aeMovement / aeShooting / aeCharge / aeFight. */
    .action-entry .bluCircle2 > div[class^="ae"] {
      display: block !important;
      width: 1.65em;
      height: 1.65em;
      background-position: center !important;
      background-repeat: no-repeat !important;
      background-size: contain !important;
      color: #fff !important;
      line-height: 1 !important;
      z-index: 2;
    }

    .action-entry .bluCircle2 > div[class^="ae"]::before,
    .action-entry .bluCircle2 > div[class^="ae"]::after {
      display: block !important;
      width: 1.65em;
      height: 1.65em;
      background-position: center !important;
      background-repeat: no-repeat !important;
      background-size: contain !important;
    }

    p{margin:.30cqw 0}

    .content-image{margin:.35cqw 0}

    @media print{
      body{background:white;padding:0}
      .toolbar{display:none}
      #app{width:1200px;gap:0}
      .detachment-card{box-shadow:none;page-break-after:always}
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <label>Faction <select id="faction-primary"></select></label>
    <label id="sub-faction-row" class="hidden">Sub-Faction <select id="sub-faction"></select></label>
    <label><input id="all-factions" type="checkbox" /> Render all factions</label>
  </div>
  <main id="app"></main>
<script src="./waha_content_render_utils.js?v=1"></script>
<script>
function imageSrc(block) {
  const src = block?.src || '';
  if (!src) return '';

  // The manifest localizes Wahapedia direct <img> assets, keyed by original src.
  // Fall back to the original src so the renderer still works if a manifest is
  // missing or has not yet been rebuilt with the new parser output.
  return MANIFEST.direct_image_assets?.[src]?.asset
    || MANIFEST.direct_image_assets?.[src]?.url
    || src;
}

function renderImageBlock(block) {
  const src = imageSrc(block);
  if (!src) return '';

  const attrs = [
    `src="${esc(src)}"`,
    `alt="${esc(block.alt || '')}"`,
  ];

  const classes = Array.isArray(block.classes) ? block.classes.filter(Boolean) : [];
  if (classes.length) attrs.push(`class="${esc(classes.join(' '))}"`);
  if (block.style) attrs.push(`style="${esc(block.style)}"`);

  return `<img ${attrs.join(' ')}>`;
}


function isDsCharBlock(block) {
  if (!block || block.displayItem !== 'element') return false;
  const classes = Array.isArray(block.classes) ? block.classes : [];
  return classes.includes('dsCharWrap');
}

function renderDsCharEntry(iconBlocks, textBlocks) {
  const iconsHtml = iconBlocks.map(blockHtml).join('');
  const textHtml = textBlocks.map(block => {
    if (!block) return '';
    if (block.displayItem === 'br') return '';
    if (block.displayItem === 'p') return blockHtml(block);
    if (block.displayItem === 'span') return `<p>${inlineBlockHtml(block)}</p>`;
    return blockHtml(block);
  }).join('');

  if (!textHtml) {
    return `<div class="ds-char-icons">${iconsHtml}</div>`;
  }

  return `
    <div class="ds-char-entry">
      <div class="ds-char-icons">${iconsHtml}</div>
      <div class="ds-char-text">${textHtml}</div>
    </div>
  `;
}

function renderActionEntry(iconBlocks, textBlocks) {
  const iconsHtml = iconBlocks.map(block => `<div class="action-icon-unit">${blockHtml(block)}</div>`).join('');
  const textHtml = textBlocks.map(block => {
    if (!block) return '';
    if (block.displayItem === 'br') return '';
    if (block.displayItem === 'p') return blockHtml(block);
    if (block.displayItem === 'span') return `<p>${inlineBlockHtml(block)}</p>`;
    return blockHtml(block);
  }).join('');

  if (!textHtml) {
    return `<div class="action-icons action-icons-standalone">${iconsHtml}</div>`;
  }

  return `
    <div class="action-entry">
      <div class="action-icons">${iconsHtml}</div>
      <div class="action-text">${textHtml}</div>
    </div>
  `;
}

function richBlockSequenceHtml(blocks) {
  const out = [];
  let inline = '';

  const flushInline = () => {
    if (!inline) return;
    out.push(`<p>${inline}</p>`);
    inline = '';
  };

  const list = blocks || [];

  for (let i = 0; i < list.length; i++) {
    const block = list[i];
    if (!block) continue;

    if (block.displayItem === 'br') {
      flushInline();
      out.push('<br>');
      continue;
    }

    // Wahapedia datasheet-character chips use source-page floats.
    // Reserve an explicit left rail so following prose cannot overlap the chip
    // and floated children do not collapse table-cell height.
    if (isDsCharBlock(block)) {
      flushInline();

      const icons = [];
      while (i < list.length && isDsCharBlock(list[i])) {
        icons.push(list[i]);
        i++;
      }

      const textBlocks = [];
      while (i < list.length) {
        const next = list[i];
        if (!next) {
          i++;
          continue;
        }

        if (next.displayItem === 'br') {
          i++;
          continue;
        }

        if (isDsCharBlock(next) || isActionIconBlock(next)) break;

        const isInlineParagraph = next.displayItem === 'p' && !shouldKeepOwnBlock(next);
        const isInlineSpan = next.displayItem === 'span' && !shouldKeepOwnBlock(next);

        if (!isInlineParagraph && !isInlineSpan) break;

        textBlocks.push(next);
        i++;
      }

      i--;
      out.push(renderDsCharEntry(icons, textBlocks));
      continue;
    }

    // Wahapedia action cards use one or more redDiamondLeft icon widgets as a
    // left rail for the following TRIGGER/EFFECT text. Render those together so
    // the icon rail reserves horizontal space instead of overlapping prose.
    if (isActionIconBlock(block)) {
      flushInline();

      const icons = [];
      while (i < list.length && isActionIconBlock(list[i])) {
        icons.push(list[i]);
        i++;
      }

      const textBlocks = [];
      while (i < list.length) {
        const next = list[i];
        if (!next) {
          i++;
          continue;
        }

        if (next.displayItem === 'br') {
          i++;
          continue;
        }

        if (isActionIconBlock(next)) break;

        const isInlineParagraph = next.displayItem === 'p' && !shouldKeepOwnBlock(next);
        const isInlineSpan = next.displayItem === 'span' && !shouldKeepOwnBlock(next);

        if (!isInlineParagraph && !isInlineSpan) break;

        textBlocks.push(next);
        i++;
      }

      i--;
      out.push(renderActionEntry(icons, textBlocks));
      continue;
    }

    // A 'p' block reaching here (not consumed by the ds-char/action-icon
    // rail lookaheads above, which deliberately want the opposite) is
    // always a complete, already-decided paragraph from the parser —
    // unlike the old schema's small inline fragments, there's no more
    // ambiguity left for the renderer to resolve by merging it with
    // whatever follows.
    if (block.displayItem === 'p' || shouldKeepOwnBlock(block)) {
      flushInline();
      out.push(blockHtml(block));
      continue;
    }

    inline += inlineBlockHtml(block);
  }

  flushInline();
  return out.join('');
}

function blockHtml(block) {
  if (!block) return '';

  if (Array.isArray(block)) {
    return block.map(blockHtml).join('');
  }

  if (block.displayItem === 'img') {
    return renderContentImageBlock(block);
  }

  if (block.displayItem === 'element') {
    return renderElementBlock(block);
  }

  if (block.displayItem === 'cs_rule') {
    // requirement is usually plain text (e.g. "N/A") but can be a D6-pip
    // icon widget instead (an element block with no text at all).
    const reqHtml = (block.requirement && typeof block.requirement === 'object')
      ? blockHtml(block.requirement)
      : esc(block.requirement || '');

    return `
      <div class="cs-rule">
        <div class="cs-req">${reqHtml}</div>
        <div class="cs-content">
          <div class="cs-title">${esc(block.title)}</div>
          ${richBlockSequenceHtml(block.content || [])}
        </div>
      </div>
    `;
  }

  if (block.displayItem === 'subrule') {
    return `
      <div class="subrule-title">${esc(block.title)}</div>
      ${richBlockSequenceHtml(block.content || [])}
    `;
  }

  if (block.displayItem === 'ul' || block.displayItem === 'ol') {
    const tag = block.displayItem;

    return `
      <${tag} class="content-list">
        ${(block.items || []).map(contentItemHtml).join('')}
      </${tag}>
    `;
  }

  if (block.displayItem === 'table') {
    const cellHtml = cell => {
      if (!cell) return '';

      // Some Wahapedia table cells contain rich block content, e.g. multiple
      // paragraphs where only the first paragraph has classes such as impact18.
      // Rendering those cells with textRuns(cell) flattens all child runs into
      // one span and loses both paragraph breaks and block-scoped classes.
      if (Array.isArray(cell.content)) {
        return richBlockSequenceHtml(cell.content);
      }

      if (Array.isArray(cell)) {
        return cell.map(blockHtml).join('');
      }

      return textRuns(cell);
    };

    const tdAttrs = cell => tableCellAttrs(
      cell,
      Array.isArray(cell?.content) && isImageOnlyCellContent(cell.content) ? ['icon-cell'] : []
    );

    return `
      <table class="content-table">
        <tbody>
          ${(block.rows || []).map(row => `
            <tr>
              ${row.map(cell => `<td${tdAttrs(cell)}>${cellHtml(cell)}</td>`).join('')}
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  if (block.displayItem === 'br') {
    return '<br>';
  }

  const allowed = new Set([
    'p',
    'span',
    'strong',
    'b',
    'em',
    'i',
    'u',
    'small',
  ]);

  const tag = String(block.displayItem || 'span').toLowerCase();
  const safeTag = allowed.has(tag) ? tag : 'span';

  return `<${safeTag}${blockAttrs(block)}>${textRuns(block)}</${safeTag}>`;
}

const DATA_URLS = ['waha_data.json', 'waha_data(3).json'];
const MANIFEST_URLS = ['waha_css_manifest.json', 'waha_css_manifest(2).json'];
let DATA = {};
let MANIFEST = {};
const $ = s => document.querySelector(s);
const app = $('#app');

async function fetchFirst(urls, fallback) {
  for (const url of urls) {
    try {
      const res = await fetch(url);
      if (res.ok) return await res.json();
    } catch (err) {}
  }
  return fallback;
}



function cssUrl(value) {
  return String(value || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '');
}


function selectorForClassKey(key) {
  const classes = String(key || '').trim().split(/\s+/).filter(Boolean);
  if (!classes.length) return '';
  return classes.map(cls => `.${CSS.escape(cls)}`).join('');
}

function snapshotCss(snapshot) {
  if (!snapshot || typeof snapshot !== 'object') return '';
  const pairs = [];

  const add = (prop, value) => {
    if (!value || value === 'none' || value === 'normal' || value === 'auto' || value === '0px') return;
    pairs.push(`${prop}:${value}`);
  };

  add('width', snapshot.width);
  add('height', snapshot.height);
  add('color', snapshot.color);
  add('background-color', snapshot.backgroundColor && snapshot.backgroundColor !== 'rgba(0, 0, 0, 0)' ? snapshot.backgroundColor : '');
  add('background-size', snapshot.backgroundSize);
  add('background-repeat', snapshot.backgroundRepeat);
  add('background-position', snapshot.backgroundPosition);
  add('filter', snapshot.filter);
  add('border-radius', snapshot.borderRadius);
  add('clip-path', snapshot.clipPath);

  const bg = snapshot.backgroundImageAsset || snapshot.backgroundImageUrl || snapshot.backgroundImageAssets?.[0] || snapshot.backgroundImageUrls?.[0];
  if (bg) pairs.push(`background-image:url('${cssUrl(bg)}')`);

  const mask = snapshot.maskImageAsset || snapshot.maskImageUrl || snapshot.maskImageAssets?.[0] || snapshot.maskImageUrls?.[0];
  if (mask) pairs.push(`mask-image:url('${cssUrl(mask)}')`);

  const webkitMask = snapshot.webkitMaskImageAsset || snapshot.webkitMaskImageUrl || snapshot.webkitMaskImageAssets?.[0] || snapshot.webkitMaskImageUrls?.[0];
  if (webkitMask) pairs.push(`-webkit-mask-image:url('${cssUrl(webkitMask)}')`);

  const contentAsset = snapshot.contentAsset || snapshot.contentUrl || snapshot.contentAssets?.[0] || snapshot.contentUrls?.[0];
  if (contentAsset) pairs.push(`content:url('${cssUrl(contentAsset)}')`);
  else if (snapshot.content && snapshot.content !== 'none') pairs.push(`content:${snapshot.content}`);

  return pairs.join(';');
}

function pushManifestStyleRule(rules, selector, snapshot) {
  const css = snapshotCss(snapshot);
  if (selector && css) rules.push(`${selector}{${css}}`);
}

function applyManifestAssetCss() {
  const oldAsset = document.getElementById('manifest-asset-css');
  if (oldAsset) oldAsset.remove();

  const rules = [];

  // waha_css_manifest.json's `icons` entries are keyed by the same sorted
  // class-set key as the widget's actual DOM classes, with real CSS
  // resolved separately for the element itself and its ::before/::after
  // pseudo-elements (some Wahapedia icon glyphs are drawn via pseudo content).
  for (const [key, snapshot] of Object.entries(MANIFEST.icons || {})) {
    const selector = selectorForClassKey(key);
    pushManifestStyleRule(rules, selector, snapshot.element);
    pushManifestStyleRule(rules, `${selector}::before`, snapshot.before);
    pushManifestStyleRule(rules, `${selector}::after`, snapshot.after);
  }

  setActiveManifest(MANIFEST);

  if (!rules.length) return;
  const style = document.createElement('style');
  style.id = 'manifest-asset-css';
  style.textContent = rules.join('\n');
  document.head.appendChild(style);
}

function headingStyle(heading) {
  const style = { color: heading?.color || '#fff' };
  if (heading?.background) style.background = heading.background;
  return Object.entries(style).map(([k,v]) => `${k}:${v}`).join(';');
}

function factionFrameColor(factionData, inheritedThemeData) {
  // Not just the first rule: some factions' first-listed rule is a plain,
  // unbannered heading on Wahapedia's own page (e.g. Chaos Knights' first
  // rule uses <h2 class="hdrNoColor">) and has no background at all — the
  // card's overall theme should still pick up whichever rule DOES carry
  // the faction's real theme colour, not silently fall back to generic.
  const rules = Object.values(factionData?.army_rules || {});
  const themedRule = rules.find(r => r?.heading?.background);
  if (themedRule) return themedRule.heading.background;

  const firstUnit = Object.values(factionData?.unit_cards || {})[0]
    || Object.values(inheritedThemeData?.unit_cards || {})[0];
  return firstUnit?.theme?.banner || null;
}

function factionTheme(factionData, inheritedThemeData) {
  const frame = factionFrameColor(factionData, inheritedThemeData);
  return frame ? `background:${frame};color:#fff` : 'color:#fff';
}

const STRUCTURAL_KEYS = new Set([
  'unit_cards',
  'detachment_cards',
  'army_rules',
  'theme',
]);

function hasArmyRules(node) {
  return node?.army_rules && Object.keys(node.army_rules).length > 0;
}

function isFactionChildNode(childName, childNode) {
  return !STRUCTURAL_KEYS.has(childName)
    && childNode
    && typeof childNode === 'object'
    && !Array.isArray(childNode)
    && hasArmyRules(childNode);
}

function topLevelFactionRows() {
  return Object.entries(DATA || {})
    .filter(([name, node]) => node && typeof node === 'object' && !Array.isArray(node))
    .map(([name, node]) => {
      const inheritedThemeData = node.unit_cards ? node : null;
      const subfactions = Object.entries(node)
        .filter(([childName, childNode]) => isFactionChildNode(childName, childNode))
        .map(([childName, childNode]) => ({
          id: `${name}::${childName}`,
          parentId: name,
          factionName: childName,
          displayName: childName,
          factionData: childNode,
          inheritedThemeData,
          isSubfaction: true,
        }))
        .sort((a, b) => a.displayName.localeCompare(b.displayName));

      return {
        id: name,
        factionName: name,
        displayName: name,
        factionData: node,
        inheritedThemeData,
        hasOwnRules: hasArmyRules(node),
        subfactions,
      };
    })
    .filter(row => row.hasOwnRules || row.subfactions.length)
    .sort((a, b) => a.displayName.localeCompare(b.displayName));
}

function allArmyRuleRows() {
  return topLevelFactionRows().flatMap(row => {
    const rows = [];
    if (row.hasOwnRules) rows.push(row);
    rows.push(...row.subfactions);
    return rows;
  });
}

function selectedTopLevelFaction() {
  const id = $('#faction-primary').value;
  return topLevelFactionRows().find(x => x.id === id);
}

function syncSubfactionDropdown() {
  const row = selectedTopLevelFaction();
  const subRow = $('#sub-faction-row');
  const subSelect = $('#sub-faction');
  const options = [];

  if (row?.hasOwnRules) {
    options.push(`<option value="__parent__">${esc(row.displayName)}</option>`);
  }

  for (const sub of row?.subfactions || []) {
    options.push(`<option value="${esc(sub.id)}">${esc(sub.displayName)}</option>`);
  }

  subSelect.innerHTML = options.join('');
  subRow.classList.toggle('hidden', !row || row.subfactions.length === 0);
  subSelect.disabled = $('#all-factions').checked || !row || row.subfactions.length === 0;
}

function populate() {
  const rows = topLevelFactionRows();
  $('#faction-primary').innerHTML = rows.map(x => `<option value="${esc(x.id)}">${esc(x.displayName)}</option>`).join('');
  syncSubfactionDropdown();
  render();
}

function selectedFactionRows() {
  if ($('#all-factions').checked) return allArmyRuleRows();

  const row = selectedTopLevelFaction();
  if (!row) return [];

  const subValue = $('#sub-faction').value;
  if (row.subfactions.length && subValue !== '__parent__') {
    const sub = row.subfactions.find(x => x.id === subValue);
    if (sub) return [sub];
  }

  if (row.hasOwnRules) return [row];
  return row.subfactions.length ? [row.subfactions[0]] : [];
}

function cardHeader(factionName, factionData, inheritedThemeData) {
  return `
    <div class="header" style="${factionTheme(factionData, inheritedThemeData)}">
      <div class="kicker">${esc(factionName)}</div>
      <div class="page-title">Army Rules</div>
    </div>`;
}

function renderArmyRule(rule) {
  return `
    <section class="army-rule">
      <div class="section-title" style="${headingStyle(rule.heading)}">${esc(rule.name)}</div>
      <div class="rule-body">${(rule.content || []).map(blockHtml).join('')}</div>
    </section>`;
}

function renderArmyRulesCard(row) {
  const { factionName, displayName, factionData, inheritedThemeData } = row;
  const rules = Object.values(factionData?.army_rules || {});
  // .section-title (and the card border) fall back to var(--frame) whenever
  // a rule's own heading has no background (e.g. a plain, unbannered
  // Wahapedia heading) — without setting --frame here too, that fallback
  // silently used the generic :root default instead of this faction's
  // actual theme colour, even though the header right above it got it
  // right (factionTheme applies the same colour, but only inline on
  // .header, never onto the shared --frame variable other elements read).
  const frame = factionFrameColor(factionData, inheritedThemeData);
  const frameStyle = frame ? ` style="--frame:${esc(frame)}"` : '';
  return `
    <article class="detachment-card army-rules-card"${frameStyle} data-faction="${esc(displayName)}">
      ${cardHeader(factionName, factionData, inheritedThemeData)}
      <div class="content">
        <div class="army-rules-fit">
          ${rules.map(renderArmyRule).join('')}
        </div>
      </div>
    </article>`;
}

function armyRulesCardFilename(card) {
  return `${card.dataset.faction || 'army'}-army-rules`;
}

function attachExportUi() {
  addDownloadAllButton($('.toolbar'), () => document.querySelectorAll('.army-rules-card'), armyRulesCardFilename);
}

function render() {
  app.innerHTML = selectedFactionRows()
    .map(renderArmyRulesCard)
    .join('');

  attachExportUi();

  requestAnimationFrame(() => {
    fitAll();
    requestAnimationFrame(fitAll);
  });

  // Web fonts and background asset layout can settle after the first animation
  // frames. Re-run fitting once those are ready so late line-height/text metrics
  // cannot leave the final line clipped at the card boundary.
  if (document.fonts?.ready) {
    document.fonts.ready.then(() => requestAnimationFrame(fitAll));
  }
}

function measuredContentHeight(box, inner) {
  if (!box || !inner) return 0;

  const boxRect = box.getBoundingClientRect();
  let maxBottom = inner.getBoundingClientRect().bottom;

  const includeRect = rect => {
    if (rect && (rect.width || rect.height)) {
      maxBottom = Math.max(maxBottom, rect.bottom);
    }
  };

  // scrollHeight misses a few cases that matter for preserved Wahapedia HTML:
  // collapsed margins, transformed/icon widgets, overflow-visible descendants
  // and sometimes inline text line boxes. Measure element rects and text-node
  // ranges so clipped final prose still triggers a shrink pass.
  inner.querySelectorAll('*').forEach(el => {
    for (const rect of el.getClientRects()) includeRect(rect);
  });

  const walker = document.createTreeWalker(inner, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      return node.nodeValue && node.nodeValue.trim()
        ? NodeFilter.FILTER_ACCEPT
        : NodeFilter.FILTER_REJECT;
    }
  });

  const range = document.createRange();
  while (walker.nextNode()) {
    range.selectNodeContents(walker.currentNode);
    for (const rect of range.getClientRects()) includeRect(rect);
  }
  range.detach();

  return Math.max(inner.scrollHeight || 0, maxBottom - boxRect.top);
}

function needsVerticalFit(box, inner, bottomPad = 0) {
  const availableH = Math.max(0, box.clientHeight - bottomPad);
  const neededH = measuredContentHeight(box, inner);
  return !!availableH && neededH > availableH + 0.5;
}

function fitBox(box, inner, bottomPad = 0) {
  if (!box || !inner) return;

  inner.style.transform = '';
  inner.style.width = '100%';

  const availableH = Math.max(0, box.clientHeight - bottomPad);
  const neededH = measuredContentHeight(box, inner);

  if (!availableH || !neededH) return;

  // Army-rules content should always use the card width. Some preserved
  // Wahapedia widgets report very large scrollWidth values, which previously
  // caused the whole card to be scaled down even when the actual layout was fine.
  // Only apply a final transform for vertical overflow, and keep the same bottom
  // safety pad used by the font-size fitting loop.
  const scale = Math.min(1, availableH / neededH);
  inner.style.transform = `scale(${scale})`;
  inner.style.width = '100%';
}

function fitArmyRulesCard(card) {
  card.style.setProperty('--rule-fs', '2.4cqw');
  const content = card.querySelector('.content');
  const fit = card.querySelector('.army-rules-fit');
  if (!content || !fit) return;

  fit.style.transform = '';
  fit.style.width = '100%';

  // Leave enough spare room that anti-aliased descenders and final-line boxes do
  // not get clipped by the card's overflow:hidden edge. This fixes cards such
  // as Thousand Sons where the final line can sit fractionally below the content
  // boundary even though scrollHeight reports a fit.
  const FIT_BOTTOM_PAD = 28;

  for (let pass = 0; pass < 100 && needsVerticalFit(content, fit, FIT_BOTTOM_PAD); pass++) {
    const fs = parseFloat(getComputedStyle(card).getPropertyValue('--rule-fs')) || 2.4;
    if (fs <= 0.92) break;
    card.style.setProperty('--rule-fs', (fs - 0.035) + 'cqw');
  }

  fitBox(content, fit, FIT_BOTTOM_PAD);

  // This all ran synchronously right after the card's HTML was inserted,
  // before any <img> has had a chance to actually load over the network —
  // a still-loading image measures as zero-height, so content containing
  // one can pass the fit check above yet grow well past the card's bottom
  // edge (clipped by overflow:hidden) once it finishes loading a moment
  // later, with nothing to redo the fit against its real size. Re-run once
  // every image that was still pending has settled (loaded or failed).
  const pendingImages = [...card.querySelectorAll('img')].filter(img => !img.complete);
  if (pendingImages.length) {
    let remaining = pendingImages.length;
    const onSettled = () => {
      remaining -= 1;
      if (remaining <= 0) fitArmyRulesCard(card);
    };
    pendingImages.forEach(img => {
      img.addEventListener('load', onSettled, { once: true });
      img.addEventListener('error', onSettled, { once: true });
    });
  }
}

function fitAll() {
  document.querySelectorAll('.army-rules-card').forEach(fitArmyRulesCard);
}

$('#faction-primary').addEventListener('change', () => {
  syncSubfactionDropdown();
  render();
});
$('#sub-faction').addEventListener('change', render);
$('#all-factions').addEventListener('change', () => {
  const disabled = $('#all-factions').checked;
  $('#faction-primary').disabled = disabled;
  syncSubfactionDropdown();
  render();
});

Promise.all([
  fetchFirst(DATA_URLS, {}),
  fetchFirst(MANIFEST_URLS, {})
]).then(([d, m]) => {
  DATA = d;
  MANIFEST = m;
  applyManifestAssetCss();
  populate();
});
</script>
</body>
</html>
