<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Core Stratagem Renderer</title>
  <link rel="stylesheet" href="./waha_common.css" />
  <style>
    :root{
      --card-w:1800px; --card-h:1200px; --strat-card-w:1200px; --strat-card-h:1800px; --paper:#ece9df; --ink:#111; --banner:#084563;
      --frame:#4b6262; --green:#22796c; --blue:#096691; --red:#bf0d12;
      --font:"Conduit ITC","ConduitITC","Bahnschrift Condensed","Aptos Narrow","Arial Narrow",Arial,sans-serif;
    }
    *{box-sizing:border-box} body{margin:0;background:#242424;color:var(--ink);font-family:var(--font);padding:24px}
    .toolbar{max-width:var(--card-w);margin:0 auto 16px;color:#ddd;font:14px Arial,sans-serif;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar select{padding:6px 8px}.toolbar label{display:flex;gap:6px;align-items:center}
    #app{width:min(96vw,var(--card-w));margin:0 auto;display:grid;gap:24px}.hidden{display:none!important}
    .core-stratagem-card {
        width: 1200px;
        height: 1800px;
        background: var(--paper);
        border: 4px solid var(--frame);
        position: relative;
        overflow: hidden;
        container-type: inline-size;
        box-shadow: 0 12px 40px rgba(0,0,0,.45);
    }
    .core-stratagem-card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 18% 22%,rgba(255,255,255,.35),transparent 28%),linear-gradient(90deg,rgba(0,0,0,.035),transparent 20%,transparent 80%,rgba(0,0,0,.07));pointer-events:none}
    .header{position:absolute;left:4%;right:4%;top:3%;height:10.2%;background:var(--banner);color:#fff;padding:0 1.55%;text-transform:uppercase;font-weight:900;letter-spacing:.035em;line-height:.95}.header::after{content:"";position:absolute;left:1.55%;right:1.55%;top:50%;height:.42cqw;background:#fff;transform:translateY(-50%)}.kicker{position:absolute;left:1.55%;right:1.55%;top:12%;font-size:2.26cqw;line-height:1}.page-title{position:absolute;left:1.55%;right:1.55%;line-height:.9}
    .rule-card,
    .core-stratagem-card {
        margin: 0 auto;
    }
    .rule-card .header{
      height:8.2%;
    }
    .rule-card .kicker{
      font-size:4.2cqw;
    }
    .rule-card .page-title{
      font-size:3.9cqw;
      bottom:11%;
    }
    .core-stratagem-card .page-title{font-size:3.4cqw; bottom:11%;}
    .content{position:absolute;left:4%;right:4%;top:16%;bottom:4%;overflow:hidden}
    .section-title{background:var(--frame);color:white;text-transform:uppercase;font-weight:900;letter-spacing:.04em;font-size:3.0cqw;padding:.35cqw 1cqw;margin-bottom:.75cqw}
    .rule-body{font:var(--rule-fs,2.4cqw)/1.20 var(--font)}
    .rule-name,
    .enh-name{font-weight:900;text-transform:uppercase;font-size:calc(var(--enh-fs,2.15cqw) * 1.5);letter-spacing:.02em;margin:.35cqw 0 .14cqw}
    .subrule-title{font-weight:900;text-transform:uppercase;font-size:calc(var(--rule-fs,2.4cqw) * 1.15);margin:.55cqw 0 .08cqw}.enh-grid{display:grid;grid-template-columns:1fr 1fr;gap:.85cqw 2.0cqw}.enh-card{border-top:.18cqw dotted #222;padding-top:.32cqw;min-width:0}
    .enh-text{font:var(--enh-fs,2.15cqw)/1.16 var(--font)}
    .rule-table,
    .content-table{
      width:100%;
      border-collapse:collapse;
      margin:.35cqw 0;
      font:inherit;
    }

    .rule-table td,
    .content-table td{
      padding:.08cqw .6cqw .08cqw 0;
      font-weight:900;
      text-transform:uppercase;
    }
     p{margin:.30cqw 0}
    .rule-card .content{
      top:12.2%;
      bottom:3.2%;
      display:grid;
      grid-template-rows:var(--rules-row, auto) minmax(0, 1fr);
      gap:1.1cqw;
    }
    .rules-zone,
    .enh-zone{
      min-height:0;
      overflow:hidden;
      position:relative;
    }
    .rules-fit,
    .enh-fit{
      transform-origin:top left;
      width:100%;
    }
    .enh-zone{
      display:grid;
      grid-template-rows:auto minmax(0,1fr);
    }
    .core-stratagem-card .header{height:8.2%;}.core-stratagem-card .kicker{font-size:3.7cqw}.core-stratagem-card .page-title{font-size:3.2cqw}.core-stratagem-card .content{top:12.2%;bottom:3.2%}
    .core-stratagem-grid{
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 2.3cqw;
      align-items: start;
      height: 100%;
      overflow: hidden;
    }
    .core-stratagem-col{
      display: flex;
      flex-direction: column;
      gap: 1.5cqw;
      min-width: 0;
    }
    .core-stratagem{display: grid;grid-template-columns: 8.7cqw 1fr;gap: 1.25cqw;min-height: auto;}
    .core-stratagem-icons{
      --diamond-size: 5.7cqw;
      --diamond-gap: 1.05cqw;

      position: relative;
      width: 8.4cqw;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 1.05cqw;
      gap: var(--diamond-gap);
    }
    .core-stratagem-icons::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:.64cqw;transform:translateX(-50%);background:currentColor;z-index:0}
    .diamond-slot{
      width: calc(var(--diamond-size) * 1.41421356);
      height: calc(var(--diamond-size) * 1.41421356);
      display: grid;
      place-items: start center;
      flex: 0 0 auto;
      z-index: 1;
    }
    .diamond-slot:first-child{
      height: var(--diamond-size);
      margin-bottom: calc((var(--diamond-size) * 1.41421356) - var(--diamond-size));
    }
    .diamond{
      width: var(--diamond-size);
      height: var(--diamond-size);
      background: var(--paper);
      border: .64cqw solid currentColor;
      transform: rotate(45deg);
      display: grid;
      place-items: center;
    }
    .diamond > *{
      transform: rotate(-45deg);
    }
    .cp{font-weight:900;font-size:2.15cqw;line-height:1;color:currentColor}.phase-icon{width:3.8cqw;height:3.8cqw;background-color:transparent;background-repeat:no-repeat;background-size:contain;background-position:center}.str10ColorEither .phase-icon{filter:invert(40%) sepia(12%) saturate(2210%) hue-rotate(121deg) brightness(94%) contrast(88%)}.str10ColorYour .phase-icon{filter:invert(23%) sepia(88%) saturate(2002%) hue-rotate(179deg) brightness(87%) contrast(93%)}.str10ColorEnemy .phase-icon{filter:invert(10%) sepia(76%) saturate(6071%) hue-rotate(352deg) brightness(102%) contrast(99%)}.core-stratagem-body{min-width:0;overflow:hidden}.core-stratagem-name{font-weight:900;text-transform:uppercase;font-size:var(--strat-name-fs,3.39cqw);line-height:1;color:currentColor;letter-spacing:.04em;border-bottom:.30cqw solid currentColor;padding-bottom:.18cqw;white-space:nowrap;overflow:hidden;text-overflow:clip}.core-stratagem-type{font-weight:900;text-transform:uppercase;font-size:var(--strat-type-fs,3.15cqw);line-height:1.05;margin:.28cqw 0 .22cqw}.dotline{border-top:.20cqw dotted #111;height:0;margin:.13cqw 0 .28cqw}.core-stratagem-text{font:var(--strat-fs,3.15cqw)/1.08 var(--font)}.core-stratagem-field{margin:.14cqw 0 .30cqw}.label{display:inline;font-weight:900;color:currentColor;text-transform:uppercase;margin-right:.22em}.str10ColorEither{color:var(--green)}.str10ColorYour{color:var(--blue)}.str10ColorEnemy{color:var(--red)}
  
    .core-stratagem-card { margin: 0 auto; }
    .core-stratagem-card .header{height:8.2%;}
    .core-stratagem-card .kicker{font-size:3.7cqw}
    .core-stratagem-card .page-title{font-size:3.2cqw; bottom:11%;}
    .core-stratagem-card .content{top:12.2%;bottom:3.2%}
  </style>
</head>
<body>
  <script src="./waha_content_render_utils.js"></script>
  <div class="toolbar"><label>Show <select id="show"><option value="stratagems">Core stratagems</option></select></label></div>
  <main id="app"></main>
<script>
const DATA_URL='core_stratagems.json', MANIFEST_URL='detachment_css_manifest.json';
let DATA={}, MANIFEST={};
const $=s=>document.querySelector(s), app=$('#app');
function colourClass(cls){return cls||'str10ColorEither'}
function iconStyle(icon){ const item=MANIFEST.stratagem_icons?.[icon]; const path=item?.backgroundImageAsset || ''; return path ? `style="background-image:url('${esc(path)}')"` : ''; }
function cardHeader(card,title){
  return `<div class="header"><div class="kicker">${esc(card.faction || 'Core Rules')}</div><div class="page-title">${esc(title)}</div></div>`;
}
function fieldHtml(val){
  if (!val) return '';
  if (Array.isArray(val)) return val.map(fieldHtml).join('');
  if (val.displayItem === 'p') return textRuns(val);
  return blockHtml(val);
}
function renderCoreStratagem(s){
  const color=colourClass(s.color_class);
  const icons=(s.icon_classes&&s.icon_classes.length?s.icon_classes:['str10Any']).concat(['CP:'+s.cp]);
  const iconHtml = icons.map(i =>
    i.startsWith('CP:')
      ? `<div class="diamond-slot"><div class="diamond"><div class="cp">${esc(i.slice(3)||'1CP')}</div></div></div>`
      : `<div class="diamond-slot"><div class="diamond"><div class="phase-icon" ${iconStyle(i)}></div></div></div>`
  ).join('');
  const field = (label, val) => val ? `<div class="core-stratagem-field"><span class="label">${label}:</span>${fieldHtml(val)}</div>` : '';
  return `<section class="core-stratagem ${color}"><div class="core-stratagem-icons">${iconHtml}</div><div class="core-stratagem-body"><div class="core-stratagem-name">${esc(s.name)}</div><div class="core-stratagem-type">${esc(s.type||'Stratagem')}</div><div class="dotline"></div><div class="core-stratagem-text">${field('WHEN',s.when)}${field('TARGET',s.target)}${field('EFFECT',s.effect)}${field('RESTRICTIONS',s.restrictions)}</div></div></section>`;
}
function chunkCoreStratagems(strats, pageSize = 6){
  const pages = [];
  for (let i = 0; i < strats.length; i += pageSize) {
    pages.push(strats.slice(i, i + pageSize));
  }
  return pages.length ? pages : [[]];
}
function splitCoreStratagems(strats){
  const leftCount = Math.ceil(strats.length / 2);
  return [strats.slice(0, leftCount), strats.slice(leftCount)];
}
function renderCoreStratagemPage(card, pageStrats, pageIndex, pageCount){
  const [left, right] = splitCoreStratagems(pageStrats);
  const title = pageCount > 1 ? `Core Stratagems ${pageIndex + 1}/${pageCount}` : 'Core Stratagems';
  return `<article class="core-stratagem-card" data-card="stratagems" data-page="${pageIndex + 1}">${cardHeader(card,title)}<div class="content"><div class="core-stratagem-grid"><div class="core-stratagem-col">${left.map(renderCoreStratagem).join('')}</div><div class="core-stratagem-col">${right.map(renderCoreStratagem).join('')}</div></div></div></article>`;
}
function renderCoreStratagemCards(card){
  const pages = chunkCoreStratagems(card.stratagems || [], 6);
  return pages.map((pageStrats, pageIndex) => renderCoreStratagemPage(card, pageStrats, pageIndex, pages.length)).join('');
}
function overflowing(el){ return el && (el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1); }
function fitCoreStratagems(card){
  const grid = card.querySelector('.core-stratagem-grid');
  const content = card.querySelector('.content');
  card.querySelectorAll('.core-stratagem').forEach(strat=>{
    strat.style.setProperty('--strat-name-fs','3.5cqw');
    strat.style.setProperty('--strat-fs','2.4cqw');
    strat.style.setProperty('--strat-type-fs','1.8cqw');
  });
  for(let pass = 0; pass < 120 && (overflowing(grid) || overflowing(content)); pass++){
    card.querySelectorAll('.core-stratagem').forEach(strat=>{
      const fs = parseFloat(getComputedStyle(strat).getPropertyValue('--strat-fs')) || 2.2;
      const ts = parseFloat(getComputedStyle(strat).getPropertyValue('--strat-type-fs')) || 1.6;
      if(fs > 0.86) strat.style.setProperty('--strat-fs', (fs - .035) + 'cqw');
      if(ts > 1.05) strat.style.setProperty('--strat-type-fs', (ts - .025) + 'cqw');
    });
  }
  card.querySelectorAll('.core-stratagem').forEach(strat=>{
    const name = strat.querySelector('.core-stratagem-name');
    for(let i=0; i<80 && overflowing(name); i++){
      const ns = parseFloat(getComputedStyle(strat).getPropertyValue('--strat-name-fs')) || 3;
      if(ns <= 1.65) break;
      strat.style.setProperty('--strat-name-fs', (ns - .055) + 'cqw');
    }
  });
}
function fitAll(){ document.querySelectorAll('.core-stratagem-card').forEach(fitCoreStratagems); }
function render(){ app.innerHTML = renderCoreStratagemCards(DATA); requestAnimationFrame(()=>{fitAll(); requestAnimationFrame(fitAll);}); }
Promise.all([fetch(DATA_URL).then(r=>r.json()), fetch(MANIFEST_URL).then(r=>r.json()).catch(()=>{})]).then(([d,m])=>{DATA=d;MANIFEST=m;applyManifestInlineTextCss(MANIFEST);render();});
</script>
</body>
</html>
