            ${labels.map(label => `
              <div class="stat-cell stat-${label.toLowerCase()}">
                <div class="stat-label">${esc(label)}</div>
                <div class="stat-box">${esc(p.stats?.[label] ?? '')}</div>
                ${label === 'Sv' ? renderProfileInvuln(p) : ''}
              </div>
            `).join('')}
            ${multi ? `<div class="profile-name">${esc(p.name || '')}</div>` : `<div></div>`}
          </div>
        `).join('')}
      </div>`;
    }

    function renderProfileInvuln(profile){
      const save = String(profile.invulnerable_save || '').trim();
      if(!save) return '';

      const comment = String(profile.invulnerable_save_comment || '').trim();

      return `
        <div class="invuln-wrap">
          <div class="invuln-shield">
            <span class="invuln-value">${esc(save)}</span>
          </div>
          <div class="invuln-right">
            <div class="invuln-label">Invulnerable Save</div>
            ${comment ? `<div class="invuln-comment">${esc(comment)}</div>` : ''}
          </div>
        </div>
      `;
    }

    function markerClassKey(classes){
      return [...(classes || [])].filter(Boolean).sort().join(' ');
    }

    function markerToken(key){
      let hash = 2166136261;
      for(const ch of String(key || '')){
        hash ^= ch.charCodeAt(0);
        hash = Math.imul(hash, 16777619);
      }
      return `m${(hash >>> 0).toString(16)}`;
    }

    function renderWeaponProfileMarker(w){
      const marker = w?.profile_marker;
      if(marker && Array.isArray(marker.classes) && marker.classes.length){
        const key = markerClassKey(marker.classes);
        return `<span class="weapon-profile-marker" data-marker="${esc(markerToken(key))}" aria-hidden="true"></span>`;
      }

      // Some units (e.g. Orks' Mek Gunz) assign different weapon options to
      // different models in the unit via plain text in this same slot
      // ("1-2", "3-4", "5-6") instead of a .dsPointy split-profile marker
      // shape — see extract_weapon_profile_marker/models in
      // waha_unit_scraper.py, which already captures this as w.models.
      // Without this fallback, the marker slot rendered empty and that
      // text was silently dropped from the card entirely.
      if(w?.models) return `<span class="weapon-model-range">${esc(w.models)}</span>`;

      return '';
    }

    function renderWeaponTable(weapons, title, hitKey){
      if(!weapons.length) return '';
      return `<div class="weapon-table-wrap"><table class="weapon-table">
        <colgroup><col class="name"><col class="range"><col class="a"><col class="hit"><col class="s"><col class="ap"><col class="d"></colgroup>
        <thead><tr><th>${esc(title)}</th><th>RANGE</th><th>A</th><th>${esc(hitKey)}</th><th>S</th><th>AP</th><th>D</th></tr></thead>
        <tbody>${weapons.map(w => `<tr><td><span class="weapon-name-wrap"><span class="weapon-profile-slot" aria-hidden="true">${renderWeaponProfileMarker(w)}</span><span class="weapon-name-content">${renderWeaponName(w)}</span></span></td><td>${esc(w.range)}</td><td>${esc(w.A)}</td><td>${esc(w[hitKey])}</td><td>${esc(w.S)}</td><td>${esc(w.AP)}</td><td>${esc(w.D)}</td></tr>`).join('')}</tbody>
      </table></div>`;
    }

    function renderWeaponName(w){
      const keywords = Array.isArray(w.keywords) ? w.keywords : [];
      if(!keywords.length) return `<span class="weapon-name">${esc(w.name)}</span>`;
      return `<span class="weapon-name">${esc(w.name)}</span> <span class="weapon-keywords">[${esc(keywords.map(k => String(k).toUpperCase()).join(', '))}]</span>`;
    }

    function blockLeadTitle(block){
      const runs = Array.isArray(block?.runs) ? block.runs : [];
      const first = runs[0];
      return first ? String(first.text || '').replace(/:\s*$/, '') : '';
    }

    function abilitiesForWeapons(items, weapons){
      const keywords = new Set(
        (weapons || []).flatMap(w => Array.isArray(w.keywords) ? w.keywords : []).map(norm)
      );
      return (items || []).filter(item => keywords.has(norm(blockLeadTitle(item))));
    }

    function renderWeaponAbilities(items){
      if(!Array.isArray(items) || !items.length) return '';
      return `<div class="weapon-abilities">${items.map(renderAbilityItem).join('')}</div>`;
    }

    function renderSection(section){
      return `<section class="section"><div class="section-heading">${esc(section.title || '')}</div><div class="section-body">
        ${renderMeta('CORE', section.core)}
        ${renderMeta('FACTION', section.faction)}
        ${(section.items || []).map(renderAbilityItem).join('')}
      </div></section>`;
    }

    function renderMeta(label, arr){
      if(!Array.isArray(arr) || !arr.length) return '';
      return `<div class="meta-line"><span class="label">${esc(label)}:</span> <span class="value">${esc(arr.join(', '))}</span></div>`;
    }

    function renderAbilityItem(item){
      return `<div class="ability-item">${blockHtml(item)}</div>`;
    }

    function renderKeywordGroups(groups){
      if(!groups.length) return '';

      if(groups.length === 1 && !groups[0].applies_to){
        return `<span><span class="footer-label">KEYWORDS:</span> <span class="footer-value">${esc((groups[0].keywords || []).join(', '))}</span></span>`;
      }

      return `<span>${groups.map((g, i) => {
        const label = g.applies_to
          ? String(g.applies_to).replace(/\s+ONLY$/i, '')
          : 'KEYWORDS';

        const prefix = i === 0
          ? `KEYWORDS - ${label}:`
          : ` | ${label}:`;

        return `<span class="footer-label">${esc(prefix)}</span> <span class="footer-value">${esc((g.keywords || []).join(', '))}</span>`;
      }).join('')}</span>`;
    }

    function fitCard(card){
      const left = card.querySelector('.left-col');
      const right = card.querySelector('.right-col');
      const footerBoxes = [...card.querySelectorAll('.keyword-box,.faction-box')];
      const header = card.querySelector('.art-zone');
      const title = card.querySelector('.unit-title');
      const headerContent = card.querySelector('.header-content');
      const stats = card.querySelector('.stats-area');
      const topBanner = card.querySelector('.top-banner');
      const isMulti = card.classList.contains('has-multi-profile');

      let contentTop = 26.0;
      let headerScale = 1;
      const maxContentTop = isMulti ? 46.0 : 34.0;
      const minContentTop = isMulti ? 26.0 : 26.0;
      const headerBottomMargin = isMulti ? 6 : 18;

      // minContentTop is a fixed floor sized for the ordinary case — but
      // once the header banner has ALSO been shrunk all the way to its own
      // floor (setHeaderScale's 0.72) and the columns still overflow (e.g.
      // Tactical Squad's 26 weapon profiles), that fixed floor can end up
      // reserving banner space the now-shrunk header no longer actually
      // needs. contentTopFloor lets that reservation shrink further in that
      // specific case, down to ABSOLUTE_MIN_CONTENT_TOP, instead of leaving
      // the columns clipped while unused banner space sits above them.
      const ABSOLUTE_MIN_CONTENT_TOP = 10.0;
      let contentTopFloor = minContentTop;

      const setContentTop = value => {
        contentTop = Math.max(contentTopFloor, Math.min(maxContentTop, value));
        card.style.setProperty('--content-top', `${contentTop}%`);
      };

      const setHeaderScale = value => {
        headerScale = Math.max(0.72, Math.min(1, value));
        card.style.setProperty('--header-scale', headerScale);
      };

      const profileContentBottom = () => {
        if(!header) return 0;
        const h = header.getBoundingClientRect();
        const visibleParts = [
          ...header.querySelectorAll('.stat-cell, .profile-name, .invuln-wrap')
        ];
        if(!visibleParts.length) return 0;
        return Math.max(...visibleParts.map(el => el.getBoundingClientRect().bottom - h.top));
      };

      const plaqueBottom = () => {
        if(!topBanner || !header) return 0;
        const h = header.getBoundingClientRect();
        return topBanner.getBoundingClientRect().bottom - h.top;
      };

      const requiredContentTop = () => {
        const cardRect = card.getBoundingClientRect();
        const neededPx = Math.max(profileContentBottom(), plaqueBottom()) + headerBottomMargin;
        return (neededPx / cardRect.height) * 100;
      };

      const leftOverflows = () => left.scrollHeight > left.clientHeight + 1;
      const rightOverflows = () => right.scrollHeight > right.clientHeight + 1;
      const footerOverflows = () => footerBoxes.some(x => x.scrollHeight > x.clientHeight + 1 || x.scrollWidth > x.clientWidth + 1);
      const titleOverflows = () => title && headerContent && title.scrollWidth > headerContent.clientWidth + 1;
      const headerOverflows = () => profileContentBottom() > header.clientHeight + 1;
      
      const shrinkColumns = iteration => {
        const abilityFont = Math.max(0.74, 1 - iteration * 0.023);
        const weaponFont = Math.max(0.66, 1 - iteration * 0.024);
        card.style.setProperty('--ability-font', `calc(${abilityFont} * clamp(17px,1.46cqw,27px))`);
        card.style.setProperty('--ability-line', Math.max(1.08, 1.225 - iteration * 0.008));
        card.style.setProperty('--ability-gap', `${Math.max(.34, .68 - iteration * .018)}em`);
        card.style.setProperty('--weapon-font', `calc(${weaponFont} * clamp(16px,1.42cqw,26px))`);
        card.style.setProperty('--weapon-row-pad-y', `${Math.max(.22, .50 - iteration * .018)}em`);
        card.style.setProperty('--weapon-line', Math.max(0.92, 1.08 - iteration * 0.006));
      };

      const shrinkFooter = iteration => {
        const footerFont = Math.max(0.88, 1 - iteration * 0.014);
        card.style.setProperty('--footer-font', `calc(${footerFont} * clamp(16px,1.38cqw,26px))`);
      };

      setHeaderScale(1);
      setContentTop(minContentTop);

      // shrinkColumns' own font floors (0.74 ability / 0.66 weapon) are
      // reached in about 15 iterations — checked directly (rather than
      // gated on a fixed iteration count) so a unit whose columns bottom
      // out early hands the remaining budget to header-shrinking
      // immediately, instead of the loop wasting iterations re-applying
      // the same already-floored values while the header sits untouched.
      // That gap was real: a fixed i<34 cutoff before switching phases
      // left only 10 iterations for header-shrinking out of a 44 total
      // budget, never enough to reach setHeaderScale's own 0.72 floor —
      // e.g. Tactical Squad's 26 weapon profiles still overflowed even
      // with columns fully shrunk, because the header was only ever
      // reduced to 0.86 before the loop ran out.
      const columnFontsAtFloor = iteration => {
        const abilityFont = Math.max(0.74, 1 - iteration * 0.023);
        const weaponFont = Math.max(0.66, 1 - iteration * 0.024);
        return abilityFont <= 0.74 && weaponFont <= 0.66;
      };

      let columnIteration = 0;
      let headerIteration = 0;

      // First spend vertical space on the upper banner.  This keeps the title,
      // stats and shields as large as possible, and only scales them down after
      // the banner has reached its cap and the columns cannot give up more room.
      for(let i=0;i<60;i++){
        setContentTop(requiredContentTop());

        if((leftOverflows() || rightOverflows()) && !columnFontsAtFloor(columnIteration)){
          columnIteration++;
          shrinkColumns(columnIteration);
          continue;
        }

        if(footerOverflows()) shrinkFooter(i + 1);

        if((headerOverflows() || titleOverflows()) && contentTop >= maxContentTop - 0.05){
          headerIteration++;
          setHeaderScale(1 - headerIteration * 0.014);
          setContentTop(requiredContentTop());
          continue;
        }

        if(!leftOverflows() && !rightOverflows() && !footerOverflows() && !titleOverflows() && !headerOverflows()){
          break;
        }

        // Columns still overflow even with column fonts already at their own
        // floor — shrink the header banner too, to free up more room below
        // it. This is intentionally last.
        if(leftOverflows() || rightOverflows()){
          headerIteration++;
          const nextHeaderScale = 1 - headerIteration * 0.014;
          setHeaderScale(nextHeaderScale);

          // The header banner itself is now as small as it's allowed to get
          // — if columns are STILL overflowing at this point, the fixed
          // minContentTop floor is likely reserving banner space the
          // shrunk header no longer needs, so let that reservation shrink
          // too, gradually, down to an absolute floor.
          if(nextHeaderScale <= 0.72 + 1e-6 && (leftOverflows() || rightOverflows())){
            contentTopFloor = Math.max(ABSOLUTE_MIN_CONTENT_TOP, contentTopFloor - 0.6);
          }

          setContentTop(requiredContentTop());
        }
      }

      // Final pass: keep the expanded banner that is required by the current
      // visible header content. Do not trim it below the standard top section;
      // otherwise multi-profile cards appear to "solve" by shrinking the banner
      // instead of preserving the profile/stat scale.
      setContentTop(requiredContentTop());

      const final = {
        left: leftOverflows(),
        right: rightOverflows(),
        footer: footerOverflows(),
        title: titleOverflows(),
        header: headerOverflows()
      };
      const overflow = final.left || final.right || final.footer || final.title || final.header;
      card.classList.toggle('has-overflow', overflow);
      if(overflow){
        console.warn('Datasheet overflow after fitting:', final, card);
      } else {
        console.info('Datasheet fit OK');
      }
    }

    function norm(v){ return String(v || '').trim().toUpperCase(); }
    // esc() is not redeclared here — it's identical to the shared one in
    // waha_content_render_utils.js (confirmed byte-for-byte equivalent), so
    // this just falls through to that rather than keeping a duplicate copy.
    function markerSnapshotCss(snapshot){
      if(!snapshot) return '';
      const map = {
        boxSizing:'box-sizing',
        width:'width', height:'height', minWidth:'min-width', minHeight:'min-height',
        maxWidth:'max-width', maxHeight:'max-height', padding:'padding',
        color:'color', backgroundColor:'background-color', backgroundImage:'background-image',
        backgroundSize:'background-size', backgroundRepeat:'background-repeat',
        backgroundPosition:'background-position', filter:'filter', borderRadius:'border-radius',
        borderWidth:'border-width', borderStyle:'border-style', borderColor:'border-color',
        clipPath:'clip-path', transform:'transform', overflow:'overflow'
      };
      return Object.entries(map).map(([source, cssName]) => {
        const value = snapshot[source];
        if(!value || value === 'none' || value === 'normal' || value === 'auto') return '';
        if((source === 'backgroundColor' || source === 'color') && value === 'rgba(0, 0, 0, 0)') return '';
        return `${cssName}:${value}`;
      }).filter(Boolean).join(';');
    }

    function installWeaponMarkerCss(manifest){
      document.getElementById('manifest-weapon-marker-css')?.remove();
      const rules = [];
      for(const [key, snapshot] of Object.entries(manifest?.icons || {})){
        const selector = `.weapon-profile-marker[data-marker="${markerToken(key)}"]`;
        const elementCss = markerSnapshotCss(snapshot.element);
        if(elementCss) rules.push(`${selector}{${elementCss}}`);
        for(const pseudo of ['before','after']){
          const data = snapshot[pseudo];
          const css = markerSnapshotCss(data);
          const content = data?.content;
          if(css || (content && content !== 'none' && content !== 'normal')){
            rules.push(`${selector}::${pseudo}{content:${content && content !== 'none' ? content : '""'};${css}}`);
          }
        }
      }
      if(!rules.length) return;
      const style = document.createElement('style');
      style.id = 'manifest-weapon-marker-css';
      style.textContent = rules.join('\n');
      document.head.appendChild(style);
    }
    

    function renderSelectedCard(factionName, unitName, subFactionName = 'None') {
      const faction = allCards[factionName];
      const source = subFactionName === 'None' ? faction : faction?.[subFactionName];
      const card = source?.unit_cards?.[unitName];

      if (!card) return;

      currentCard = card;

      const app = document.getElementById('app');
      app.innerHTML = '';
      const cardEl = renderCard(card);
      app.appendChild(cardEl);
    }

// ============================================================
// SHARED DROPDOWNS / MODE DISPATCH
// ============================================================

// Faction dropdown always lists every faction in the dataset, independent
// of Rule Type — every faction has at least one of the three rule types,
// and only the Sub-Faction level ever comes up empty for a given mode.
function populateFactionDropdown() {
  const factionValues = Object.keys(DATA).sort();
  $('#faction-primary').innerHTML = factionValues
    .map(v => `<option value="${esc(v)}">${esc(v)}</option>`)
    .join('');
}

function subFactionValuesForMode(mode, factionName) {
  const index = mode === 'army' ? armyRulesIndex : mode === 'detachment' ? detachmentIndex : cardIndex;
  const matches = index.filter(x => x.factionName === factionName);

  return [...new Set(matches.map(x => x.subFactionName))].sort((a, b) => {
    if (a === 'None') return -1;
    if (b === 'None') return 1;
    return a.localeCompare(b);
  });
}

// Rebuilds the Sub-Faction dropdown for the current Faction + Rule Type,
// then selects rememberedSubFaction if this mode actually has data for it,
// else 'None' — see rememberedSubFaction's own comment for why.
function updateSubFactionDropdown() {
  const factionName = $('#faction-primary').value;
  const subFactionValues = subFactionValuesForMode(currentMode, factionName);

  $('#sub-faction').innerHTML = subFactionValues
    .map(v => `<option value="${esc(v)}">${esc(v)}</option>`)
    .join('');

  const toSelect = subFactionValues.includes(rememberedSubFaction)
    ? rememberedSubFaction
    : (subFactionValues.includes('None') ? 'None' : (subFactionValues[0] || 'None'));
  $('#sub-faction').value = toSelect;

  $('#sub-faction-row').classList.toggle(
    'hidden',
    subFactionValues.length === 0 || (subFactionValues.length <= 1 && subFactionValues[0] === 'None')
  );

  dispatchModeUpdate();
}

function setModeVisibility(mode) {
  $('#detachment-row').classList.toggle('hidden', mode !== 'detachment');
  $('#show-row').classList.toggle('hidden', mode !== 'detachment');
  $('#unit-row').classList.toggle('hidden', mode !== 'unit');
  app.className = `mode-${mode}`;
}

function dispatchModeUpdate() {
  if (currentMode === 'army') renderArmyRulesPage();
  else if (currentMode === 'detachment') updateDets();
  else if (currentMode === 'unit') updateUnits();
}

$('#rule-type').addEventListener('change', () => {
  currentMode = $('#rule-type').value;
  setModeVisibility(currentMode);
  updateSubFactionDropdown();
});

$('#faction-primary').addEventListener('change', () => {
  rememberedSubFaction = 'None';
  updateSubFactionDropdown();
});

$('#sub-faction').addEventListener('change', () => {
  rememberedSubFaction = $('#sub-faction').value || 'None';
  dispatchModeUpdate();
});

$('#detachment').addEventListener('change', renderDetachmentsPage);
$('#show').addEventListener('change', applyShow);

// ============================================================
// UNIT RULES MODE — index/dropdown wiring
// (buildCardSelector's toolbar-injection is gone — the Faction/Sub-Faction
// dropdowns are shared now — this keeps only the parts that build
// cardIndex and populate/react to the Unit dropdown.)
// ============================================================
function buildUnitIndex() {
  cardIndex = [];

  for (const [factionName, faction] of Object.entries(allCards)) {
    addUnitCards(factionName, 'None', faction);

    for (const [subFactionName, subFaction] of Object.entries(faction)) {
      if (subFactionName === 'unit_cards') continue;
      if (subFaction && typeof subFaction === 'object' && subFaction.unit_cards) {
        addUnitCards(factionName, subFactionName, subFaction);
      }
    }
  }
}

function addUnitCards(factionName, subFactionName, factionObj) {
  for (const [unitName, card] of Object.entries(factionObj.unit_cards || {})) {
    cardIndex.push({ factionName, subFactionName, unitName, card });
  }
}

function attachExportUiUnits() {
  addDownloadAllButton(
    $('.toolbar'),
    () => {
      const cardEl = app.querySelector('.datasheet-card');
      return cardEl ? [cardEl] : [];
    },
    () => currentCard?.name || 'unit',
    'Download PNG'
  );
}

function updateUnits() {
  const factionName = $('#faction-primary').value;
  const subFactionName = $('#sub-faction').value || 'None';

  const matches = cardIndex.filter(x =>
    x.factionName === factionName &&
    x.subFactionName === subFactionName
  );

  $('#unit-select').innerHTML = matches
    .sort((a, b) => a.unitName.localeCompare(b.unitName))
    .map((x, i) => `<option value="${i}">${esc(x.unitName)}</option>`)
    .join('');

  $('#unit-select')._matches = matches;
  renderChosenUnit();
}

// Strict lookup, same as renderArmyRulesPage/renderDetachmentsPage — a
// faction/sub-faction combo with no unit cards renders nothing rather than
// falling back to some other combo, so export scripts can detect "empty"
// and skip it instead of saving a duplicate image.
function renderChosenUnit() {
  const selected = $('#unit-select')._matches?.[Number($('#unit-select').value)];
  app.innerHTML = '';
  currentCard = null;
  if (!selected) return;

  currentCard = selected.card;
  app.appendChild(renderCard(selected.card));
  attachExportUiUnits();
}

$('#unit-select').addEventListener('change', renderChosenUnit);

// ============================================================
// INITIAL LOAD
// ============================================================
const DATA_URLS = ['waha_data.json', 'waha_data(3).json'];
const MANIFEST_URLS = ['waha_css_manifest.json', 'waha_css_manifest(2).json'];

Promise.all([
  fetchFirst(DATA_URLS, {}),
  fetchFirst(MANIFEST_URLS, {})
]).then(([d, m]) => {
  DATA = d;
  MANIFEST = m;
  allCards = d;
  cssManifest = m;

  applyManifestAssetCss();
  installWeaponMarkerCss(MANIFEST);

  armyRulesIndex = allArmyRulesRows();
  detachmentIndex = allDetachmentCards();
  buildUnitIndex();

  populateFactionDropdown();

  currentMode = $('#rule-type').value;
  setModeVisibility(currentMode);
  updateSubFactionDropdown();
});

</script>
</body>
</html>
